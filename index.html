    <style>
        :root {
            --bg: #0b0e11;

            --blue: #1e80ff;

        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding: 10px; }
        ::-webkit-scrollbar { width: 4px; }

        /* PWA Install Banner */
        #pwa-banner { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); padding: 12px 20px; border-top: 1px solid var(--border); z-index: 999; justify-content: space-between; align-items: center; gap: 10px; }
        #pwa-banner.show { display: flex; }
        #pwa-banner button { background: var(--blue); border: none; color: white; padding: 8px 20px; border-radius: var(--radius); cursor: pointer; font-weight: bold; }
        #pwa-banner .close { background: transparent; color: var(--text-muted); padding: 0 10px; font-size: 20px; }

        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; flex-wrap: wrap; gap: 10px; }
        .app-title { font-size: 20px; font-weight: 700; color: var(--orange); display: flex; align-items: center; gap: 8px; }
        .app-title span { font-size: 14px; color: var(--text-muted); font-weight: 400; }
        .header-controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .header-controls button { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .header-controls button:hover { background: var(--border); }
        .header-controls .btn-active { border-color: var(--green); color: var(--green); }

        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        @media (max-width: 768px) { .grid-main { grid-template-columns: 1fr; } }

        .card { background: var(--card); border-radius: var(--radius); padding: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); }

        /* Symbol & Timeframe Selectors */
        .selector-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
        .selector-row select { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: var(--radius); font-size: 14px; cursor: pointer; outline: none; }

        .symbol-btn:hover, .symbol-btn.active { border-color: var(--orange); color: var(--orange); }

        /* Chart */
        .chart-container { position: relative; height: 400px; width: 100%; background: var(--bg); border-radius: var(--radius); overflow: hidden; }
        #tradeChart { width: 100%; height: 100%; display: block; }
        .chart-overlay { position: absolute; top: 10px; left: 10px; display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); }
        .chart-overlay .price { color: var(--text); font-weight: bold; font-size: 16px; }

        /* Stats Table */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
        .stat-item { background: var(--bg); padding: 8px; border-radius: 4px; text-align: center; }
        .stat-item .label { font-size: 11px; color: var(--text-muted); }
        .stat-item .value { font-size: 16px; font-weight: 600; margin-top: 2px; }
        .value.green { color: var(--green); }

        /* Signals List */
        .signal-item { background: var(--bg); padding: 10px; border-radius: 4px; margin-bottom: 8px; border-left: 3px solid var(--text-muted); }
        .signal-item.long { border-left-color: var(--green); }

        .signal-item .header { display: flex; justify-content: space-between; font-size: 13px; }

        /* Trade Log */

        .tg-section input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 4px; flex: 1; min-width: 120px; }
        .tg-section button { background: var(--blue); border: none; color: white; padding: 6px 16px; border-radius: 4px; cursor: pointer; }
        .tg-section button:disabled { opacity: 0.5; }

        @media (max-width: 480px) {
            .app-title { font-size: 16px; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .gap-8 { gap: 8px; }
        .text-center { text-align: center; }

    <script>
        // ========================================================================
        // 1. CONFIGURATION & STATE
        // ========================================================================
        const CONFIG = {
            symbols: ['BTCUSDT', 'ETHUSDT', 'BNBUSDT', 'SOLUSDT', 'XRPUSDT', 'ADAUSDT', 'AVAXUSDT', 'DOTUSDT', 'MATICUSDT', 'LINKUSDT'],
            intervals: ['5m', '15m', '1h', '4h'],
            defaultSymbol: 'BTCUSDT',
            defaultInterval: '15m',
            candleLimit: 200
        };

        const state = {
            symbol: CONFIG.defaultSymbol,
            interval: CONFIG.defaultInterval,
            candles: [],
            signals: [],
            trades: JSON.parse(localStorage.getItem('futures_trades') || '[]'),
            stats: { total: 0, win: 0, loss: 0, winRate: 0, avgWin: 0, avgLoss: 0 },
            tgToken: localStorage.getItem('tg_token') || '',
            tgChatId: localStorage.getItem('tg_chat') || '',
            ws: null,
            chart: null,
            isAlertsOn: true,
            processing: false
        };

        // ========================================================================
        // 2. BINANCE API & WEBSOCKET
        // ========================================================================
        const BinanceAPI = {
            restURL: 'https://api.binance.com/api/v3',
            wsURL: 'wss://stream.binance.com:9443/ws',

            async fetchKlines(symbol, interval, limit = 200) {
                const url = `${this.restURL}/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
                const res = await fetch(url);
                const data = await res.json();
                return data.map(k => ({
                    time: k[0],
                    open: parseFloat(k[1]),
                    high: parseFloat(k[2]),
                    low: parseFloat(k[3]),
                    close: parseFloat(k[4]),
                    volume: parseFloat(k[5])
                }));
            },

            subscribe(symbol, callback) {
                const stream = `${symbol.toLowerCase()}@kline_${state.interval}`;
                if (state.ws) { state.ws.close(); }
                const ws = new WebSocket(`${this.wsURL}/${stream}`);
                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.e === 'kline') {
                        const k = msg.k;
                        const candle = {
                            time: k.t,
                            open: parseFloat(k.o),
                            high: parseFloat(k.h),
                            low: parseFloat(k.l),
                            close: parseFloat(k.c),
                            volume: parseFloat(k.v)
                        };
                        callback(candle);
                    }
                };
                state.ws = ws;
                return ws;
            }
        };

        // ========================================================================
        // 3. INDICATOR ENGINES (4 Indicators Integrated)
        // ========================================================================

        // ---- Helper Math ----
        function linReg(arr, len) {
            if (arr.length < len) return arr[arr.length - 1] || 0;
            const slice = arr.slice(-len);
            const n = slice.length;
            const sumX = n * (n - 1) / 2;
            const sumY = slice.reduce((a, b) => a + b, 0);
            const sumXY = slice.reduce((a, b, i) => a + b * i, 0);
            const sumX2 = n * (n - 1) * (2 * n - 1) / 6;
            const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            return intercept + slope * (n - 1);
        }

        function stdev(arr, len) {
            if (arr.length < len) return 0;
            const slice = arr.slice(-len);
            const mean = slice.reduce((a, b) => a + b, 0) / len;
            const sq = slice.reduce((a, b) => a + (b - mean) ** 2, 0);
            return Math.sqrt(sq / len);
        }

        function pivotHigh(highs, len) {
            const arr = highs.slice(-len * 2 - 1);
            if (arr.length < len * 2 + 1) return null;
            const pivot = arr[len];
            for (let i = 0; i < arr.length; i++) {
                if (i === len) continue;
                if (arr[i] > pivot) return null;
            }
            return pivot;
        }

        function pivotLow(lows, len) {
            const arr = lows.slice(-len * 2 - 1);
            if (arr.length < len * 2 + 1) return null;
            const pivot = arr[len];
            for (let i = 0; i < arr.length; i++) {
                if (i === len) continue;
                if (arr[i] < pivot) return null;
            }
            return pivot;
        }

        // ---- Indicator 1: ARBM (Adaptive Regression Breakout) ----
        function calcARBM(candles, length = 50, devMult = 2.0, sqzLen = 100, sqzPct = 20) {
            if (candles.length < length + 10) return null;
            const close = candles.map(c => c.close);
            const reg = linReg(close, length);
            const std = stdev(close, length);
            const upper = reg + std * devMult;
            const lower = reg - std * devMult;
            const bw = upper - lower;

            // Squeeze
            let minBW = Infinity, maxBW = -Infinity;
            const recent = candles.slice(-sqzLen);
            recent.forEach(c => { const v = c.high - c.low; if (v < minBW) minBW = v; if (v > maxBW) maxBW = v; });
            const widthPct = maxBW - minBW > 0.0001 ? ((bw - minBW) / (maxBW - minBW)) * 100 : 100;
            const isSqueeze = widthPct <= sqzPct;

            const lastClose = close[close.length - 1];
            const prevClose = close[close.length - 2];
            const bullBreak = lastClose > upper && prevClose <= upper && isSqueeze;
            const bearBreak = lastClose < lower && prevClose >= lower && isSqueeze;

            return { upper, lower, reg, isSqueeze, bullBreak, bearBreak, bw };
        }

        // ---- Indicator 2: LiquidityEdge (Pivots + Dominance) ----
        function calcLiquidity(candles, swingLen = 2, domThresh = 60) {
            if (candles.length < swingLen * 2 + 5) return null;
            const highs = candles.map(c => c.high);
            const lows = candles.map(c => c.low);
            const volumes = candles.map(c => c.volume);

            const ph = pivotHigh(highs, swingLen);
            const pl = pivotLow(lows, swingLen);

            // Volume Dominance (last 12 bars)
            const last12 = candles.slice(-12);
            let bullVol = 0, bearVol = 0;
            for (let i = 1; i < last12.length; i++) {
                if (last12[i].close >= last12[i - 1].close) bullVol += last12[i].volume;
                else bearVol += last12[i].volume;
            }
            const total = bullVol + bearVol;
            const bullDom = total > 0 ? (bullVol / total) * 100 : 50;
            const bearDom = total > 0 ? (bearVol / total) * 100 : 50;
            const isBullDom = bullDom > bearDom && bullDom >= domThresh;
            const isBearDom = bearDom > bullDom && bearDom >= domThresh;

            return { ph, pl, bullDom, bearDom, isBullDom, isBearDom, lastPivot: ph || pl };
        }

        // ---- Indicator 3: Volume Profile (POC, VAH, VAL) ----
        function calcVolumeProfile(candles, levels = 25, vaPct = 0.68) {
            if (candles.length < 20) return null;
            const last20 = candles.slice(-20);
            const high = Math.max(...last20.map(c => c.high));
            const low = Math.min(...last20.map(c => c.low));
            const step = (high - low) / levels;
            if (step === 0) return null;

            const volProfile = new Array(levels).fill(0);
            last20.forEach(c => {
                const idx = Math.min(Math.floor((c.close - low) / step), levels - 1);
                volProfile[idx] += c.volume;
            });

            const maxVol = Math.max(...volProfile);
            const pocIdx = volProfile.indexOf(maxVol);
            const poc = low + (pocIdx + 0.5) * step;

            // Value Area
            let totalVol = volProfile.reduce((a, b) => a + b, 0);
            let target = totalVol * vaPct;
            let sum = volProfile[pocIdx];
            let left = pocIdx,
                right = pocIdx;
            while (sum < target && (left > 0 || right < levels - 1)) {
                let lv = left > 0 ? volProfile[left - 1] : 0;
                let rv = right < levels - 1 ? volProfile[right + 1] : 0;
                if (lv >= rv && left > 0) { sum += lv;
                    left--; } else if (right < levels - 1) { sum += rv;
                    right++; } else break;
            }
            const vah = low + (right + 1) * step;
            const val = low + left * step;
            const isInValue = candles[candles.length - 1].close >= val && candles[candles.length - 1].close <= vah;

            return { poc, vah, val, isInValue, high, low };
        }

        // ---- Indicator 4: Market Structure (CHoCH / BOS) ----
        function calcStructure(candles, length = 5) {
            if (candles.length < length * 2 + 5) return null;
            const highs = candles.map(c => c.high);
            const lows = candles.map(c => c.low);
            const close = candles.map(c => c.close);

            const p = Math.floor(length / 2);
            let bullCHoCH = false,
                bearCHoCH = false,
                bullBOS = false,
                bearBOS = false;

            // Fractal detection
            const lastHigh = highs[highs.length - 1 - p];
            const lastLow = lows[lows.length - 1 - p];
            let isBullFractal = true,
                isBearFractal = true;
            for (let i = 0; i < length; i++) {
                if (i === p) continue;
                if (highs[highs.length - 1 - i] > lastHigh) isBullFractal = false;
                if (lows[lows.length - 1 - i] < lastLow) isBearFractal = false;
            }

            // Simple BOS / CHoCH logic based on swing points
            const lastClose = close[close.length - 1];
            const prevSwingHigh = Math.max(...highs.slice(-length * 2, -length));
            const prevSwingLow = Math.min(...lows.slice(-length * 2, -length));

            if (isBullFractal && lastClose > prevSwingHigh) { bullBOS = true; }
            if (isBearFractal && lastClose < prevSwingLow) { bearBOS = true; }
            if (isBullFractal && lastClose < prevSwingLow) { bearCHoCH = true; }
            if (isBearFractal && lastClose > prevSwingHigh) { bullCHoCH = true; }

            return { bullCHoCH, bearCHoCH, bullBOS, bearBOS, isBullFractal, isBearFractal };
        }

        // ========================================================================
        // 4. SCORING SYSTEM & SIGNAL GENERATION
        // ========================================================================
        function generateSignal(candles) {
            if (candles.length < 100) return null;

            const arbm = calcARBM(candles);
            const liq = calcLiquidity(candles);
            const vp = calcVolumeProfile(candles);
            const struct = calcStructure(candles);

            if (!arbm || !liq || !vp || !struct) return null;

            let score = 0;
            let reasons = [];
            let direction = 0; // 1 = long, -1 = short

            // 1. Structure (Max 25)
            if (struct.bullBOS) { score += 25;
                reasons.push('BOS صاعد (هيكل سوقي قوي)');
                direction = 1; }
            if (struct.bearBOS) { score += 25;
                reasons.push('BOS هابط (هيكل سوقي قوي)');
                direction = -1; }
            if (struct.bullCHoCH && score < 20) { score += 15;
                reasons.push('CHoCH صاعد');
                if (direction === 0) direction = 1; }
            if (struct.bearCHoCH && score < 20) { score += 15;
                reasons.push('CHoCH هابط');
                if (direction === 0) direction = -1; }

            // 2. Liquidity (Max 25)
            if (liq.isBullDom) { score += 20;
                reasons.push('سيولة شرائية (Dominance > 60%)');
                if (direction === 0) direction = 1; }
            if (liq.isBearDom) { score += 20;
                reasons.push('سيولة بيعية (Dominance > 60%)');
                if (direction === 0) direction = -1; }
            if (liq.ph && liq.pl) { score += 5;
                reasons.push('مناطق سيولة محددة'); }

            // 3. Volume Profile (Max 25)
            if (vp.isInValue) { score += 15;
                reasons.push('السعر داخل منطقة القيمة (VAH/VAL)'); }
            if (vp.poc && Math.abs(candles[candles.length - 1].close - vp.poc) / vp.poc < 0.01) { score += 10;
                reasons.push('اقتراب من POC (نقطة التحكم)'); }

            // 4. ARBM (Momentum) (Max 25)
            if (arbm.bullBreak) { score += 25;
                reasons.push('اختراق علوي مع Squeeze');
                if (direction === 0) direction = 1; }
            if (arbm.bearBreak) { score += 25;
                reasons.push('اختراق سفلي مع Squeeze');
                if (direction === 0) direction = -1; }
            if (arbm.isSqueeze) { score += 5;
                reasons.push('انكماش (Squeeze) - استعداد للحركة'); }

            // Threshold: 60+ for signal
            if (score >= 60 && direction !== 0) {
                const lastClose = candles[candles.length - 1].close;
                const atr = stdev(candles.map(c => c.close), 14) * 1.5; // proxy ATR
                const sl = direction === 1 ? lastClose - atr * 1.2 : lastClose + atr * 1.2;
                const tp1 = direction === 1 ? lastClose + atr * 1.8 : lastClose - atr * 1.8;
                const tp2 = direction === 1 ? lastClose + atr * 3.0 : lastClose - atr * 3.0;
                const rr = (tp1 - lastClose) / (lastClose - sl) * direction;

                return {
                    symbol: state.symbol,
                    interval: state.interval,
                    time: new Date().toISOString(),
                    direction: direction === 1 ? 'LONG' : 'SHORT',
                    entry: lastClose,
                    sl: sl,
                    tp1: tp1,
                    tp2: tp2,
                    rr: Math.abs(rr),
                    score: score,
                    reasons: reasons.join(' | '),
                    status: 'open'
                };
            }
            return null;
        }

        // ========================================================================
        // 5. TRADE MANAGEMENT
        // ========================================================================
        function addTrade(signal) {
            if (!signal) return;
            state.trades.push(signal);
            localStorage.setItem('futures_trades', JSON.stringify(state.trades));
            updateStats();
            renderLog();
            // Telegram alert
            sendTelegramAlert(signal);
        }

        function updateTradeStatus(index, result, exitPrice) {
            if (index < 0 || index >= state.trades.length) return;
            const t = state.trades[index];
            t.status = result;
            t.exit = exitPrice || t.tp1;
            t.closeTime = new Date().toISOString();
            if (result === 'win') t.profit = (t.exit - t.entry) / t.entry * (t.direction === 'LONG' ? 1 : -1) * 100;
            else t.profit = (t.exit - t.entry) / t.entry * (t.direction === 'LONG' ? 1 : -1) * 100;
            localStorage.setItem('futures_trades', JSON.stringify(state.trades));
            updateStats();
            renderLog();
        }

        function updateStats() {
            const closed = state.trades.filter(t => t.status !== 'open');
            const wins = closed.filter(t => t.status === 'win');
            const losses = closed.filter(t => t.status === 'loss');
            state.stats.total = closed.length;
            state.stats.win = wins.length;
            state.stats.loss = losses.length;
            state.stats.winRate = closed.length > 0 ? (wins.length / closed.length) * 100 : 0;
            const avgW = wins.length > 0 ? wins.reduce((a, b) => a + (b.profit || 0), 0) / wins.length : 0;
            const avgL = losses.length > 0 ? losses.reduce((a, b) => a + (b.profit || 0), 0) / losses.length : 0;
            state.stats.avgWin = avgW;
            state.stats.avgLoss = avgL;

            document.getElementById('sTotal').textContent = state.stats.total;
            document.getElementById('sWin').textContent = state.stats.win;
            document.getElementById('sLoss').textContent = state.stats.loss;
            document.getElementById('sWinRate').textContent = state.stats.winRate.toFixed(1) + '%';
            document.getElementById('sAvgWin').textContent = state.stats.avgWin.toFixed(2) + '%';
            document.getElementById('sAvgLoss').textContent = state.stats.avgLoss.toFixed(2) + '%';
        }

        function renderLog() {
            const body = document.getElementById('logBody');
            if (state.trades.length === 0) {
                body.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);">لا توجد صفقات</td></tr>';
                return;
            }
            let html = '';
            state.trades.slice().reverse().forEach(t => {
                const cls = t.status === 'win' ? 'win' : t.status === 'loss' ? 'loss' : '';
                const profitStr = t.profit ? (t.profit > 0 ? '+' : '') + t.profit.toFixed(2) + '%' : '--';
                html += `<tr>
                    <td>${t.symbol}</td>
                    <td style="color:${t.direction === 'LONG' ? 'var(--green)' : 'var(--red)'}">${t.direction}</td>
                    <td>${t.entry.toFixed(2)}</td>
                    <td>${t.exit ? t.exit.toFixed(2) : 'مفتوح'}</td>
                    <td class="${cls}">${profitStr}</td>
                </tr>`;
            });
            body.innerHTML = html;
        }

        // ========================================================================
        // 6. TELEGRAM INTEGRATION
        // ========================================================================
        async function sendTelegramAlert(signal) {
            if (!state.tgToken || !state.tgChatId) return;
            const emoji = signal.direction === 'LONG' ? '🟢' : '🔴';
            const msg = `🚨 *إشارة تداول جديدة*\n\n` +
                `الزوج: ${signal.symbol}\n` +
                `الفريم: ${signal.interval}\n` +
                `الاتجاه: ${emoji} ${signal.direction}\n` +
                `سعر الدخول: ${signal.entry.toFixed(2)}\n` +
                `وقف الخسارة: ${signal.sl.toFixed(2)}\n` +
                `الهدف 1: ${signal.tp1.toFixed(2)}\n` +
                `الهدف 2: ${signal.tp2.toFixed(2)}\n` +
                `نسبة المخاطرة: 1:${signal.rr.toFixed(2)}\n` +
                `نقاط القوة: ${signal.score}\n` +
                `السبب: ${signal.reasons}`;
            try {
                const url = `https://api.telegram.org/bot${state.tgToken}/sendMessage`;
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: state.tgChatId, text: msg, parse_mode: 'Markdown' })
                });
                document.getElementById('tgStatus').textContent = '✅ تم إرسال التنبيه';
            } catch (e) {
                document.getElementById('tgStatus').textContent = '❌ فشل الإرسال: ' + e.message;
            }
        }

        // ========================================================================
        // 7. CHART RENDERING (Canvas)
        // ========================================================================
        function drawChart(candles) {
            const canvas = document.getElementById('tradeChart');
            const ctx = canvas.getContext('2d');
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width || 600;
            canvas.height = rect.height || 400;

            const w = canvas.width,
                h = canvas.height;
            const pad = { top: 20, bottom: 20, left: 10, right: 10 };
            const chartW = w - pad.left - pad.right;
            const chartH = h - pad.top - pad.bottom;

            ctx.clearRect(0, 0, w, h);

            if (!candles || candles.length < 2) {
                ctx.fillStyle = '#848e9c';
                ctx.textAlign = 'center';
                ctx.font = '14px sans-serif';
                ctx.fillText('جاري تحميل البيانات...', w / 2, h / 2);
                return;
            }

            const high = Math.max(...candles.map(c => c.high));
            const low = Math.min(...candles.map(c => c.low));
            const range = high - low || 1;
            const yScale = chartH / range;

            const numCandles = candles.length;
            const candleW = Math.max(2, chartW / numCandles - 2);

            candles.forEach((c, i) => {
                const x = pad.left + i * (candleW + 2);
                const yHigh = pad.top + (high - c.high) * yScale;
                const yLow = pad.top + (high - c.low) * yScale;
                const yOpen = pad.top + (high - c.open) * yScale;
                const yClose = pad.top + (high - c.close) * yScale;

                const isBull = c.close >= c.open;
                ctx.fillStyle = isBull ? '#0ecb81' : '#f6465d';
                ctx.strokeStyle = isBull ? '#0ecb81' : '#f6465d';
                ctx.lineWidth = 1;

                // Wick
                ctx.beginPath();
                ctx.moveTo(x + candleW / 2, yHigh);
                ctx.lineTo(x + candleW / 2, yLow);
                ctx.stroke();

                // Body
                const bodyTop = Math.min(yOpen, yClose);
                const bodyBot = Math.max(yOpen, yClose);
                ctx.fillRect(x, bodyTop, candleW, Math.max(1, bodyBot - bodyTop));
            });

            // Price line
            const lastClose = candles[candles.length - 1].close;
            const yLast = pad.top + (high - lastClose) * yScale;
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.setLineDash([4, 4]);
            ctx.moveTo(pad.left, yLast);
            ctx.lineTo(w - pad.right, yLast);
            ctx.stroke();
            ctx.setLineDash([]);

            // Current Price Label
            document.getElementById('currentPrice').textContent = lastClose.toFixed(2);
        }

        // ========================================================================
        // 8. CORE LOOP & EVENT HANDLERS
        // ========================================================================
        async function loadData() {
            state.processing = true;
            try {
                const candles = await BinanceAPI.fetchKlines(state.symbol, state.interval, CONFIG.candleLimit);
                state.candles = candles;
                drawChart(candles);
                processIndicators(candles);
                // Subscribe to live updates
                BinanceAPI.subscribe(state.symbol, (candle) => {
                    if (state.candles.length > 0 && state.candles[state.candles.length - 1].time === candle.time) {
                        state.candles[state.candles.length - 1] = candle;
                    } else {
                        state.candles.push(candle);
                        if (state.candles.length > CONFIG.candleLimit) state.candles.shift();
                    }
                    drawChart(state.candles);
                    processIndicators(state.candles);
                });
            } catch (e) {
                console.error('Load error:', e);
                document.getElementById('signalList').innerHTML =
                    `<div class="text-center" style="color:var(--red);padding:20px;">⚠️ خطأ في تحميل البيانات: ${e.message}</div>`;
            }
            state.processing = false;
        }

        function processIndicators(candles) {
            if (candles.length < 50) return;

            // Generate Signal
            const signal = generateSignal(candles);
            if (signal) {
                // Check duplicates
                const exists = state.trades.some(t => t.time === signal.time);
                if (!exists) {
                    state.signals.push(signal);
                    addTrade(signal);
                    renderSignals();
                }
            }

            // Update stats & log
            updateStats();
            renderLog();
            document.getElementById('signalCount').textContent = state.signals.length + ' إشارة';
        }

        function renderSignals() {
            const container = document.getElementById('signalList');
            if (state.signals.length === 0) {
                container.innerHTML =
                    `<div class="text-center" style="color:var(--text-muted);padding:20px;">بانتظار الإشارات...</div>`;
                return;
            }
            let html = '';
            state.signals.slice().reverse().forEach(s => {
                const cls = s.direction === 'LONG' ? 'long' : 'short';
                html += `<div class="signal-item ${cls}">
                    <div class="header">
                        <span><strong>${s.symbol}</strong> (${s.interval}) <span style="color:${s.direction === 'LONG' ? 'var(--green)' : 'var(--red)'}">${s.direction}</span></span>
                        <span style="font-size:11px;color:var(--text-muted);">نقاط: ${s.score}</span>
                    </div>
                    <div class="details">
                        <span>دخول: ${s.entry.toFixed(2)}</span>
                        <span>وقف: ${s.sl.toFixed(2)}</span>
                        <span>هدف1: ${s.tp1.toFixed(2)}</span>
                        <span>هدف2: ${s.tp2.toFixed(2)}</span>
                        <span>RR: 1:${s.rr.toFixed(2)}</span>
                        <span>الحالة: ${s.status}</span>
                    </div>
                    <div class="reason">📌 ${s.reasons}</div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // ========================================================================
        // 9. UI CONTROLS
        // ========================================================================

        // Symbol / TF Selection
        document.getElementById('selSymbol').addEventListener('change', (e) => {
            state.symbol = e.target.value;
            if (state.ws) state.ws.close();
            loadData();
            updateSymbolButtons();
        });
        document.getElementById('selTF').addEventListener('change', (e) => {
            state.interval = e.target.value;
            document.getElementById('statFrameLabel').textContent = state.interval;
            if (state.ws) state.ws.close();
            loadData();
        });
        document.querySelectorAll('.symbol-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                state.symbol = btn.dataset.sym;
                document.getElementById('selSymbol').value = state.symbol;
                if (state.ws) state.ws.close();
                loadData();
                updateSymbolButtons();
            });
        });

        function updateSymbolButtons() {
            document.querySelectorAll('.symbol-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.symbol-btn[data-sym="${state.symbol}"]`)?.classList.add('active');
        }

        // Refresh
        document.getElementById('btnRefresh').addEventListener('click', () => {
            if (state.ws) state.ws.close();
            loadData();
        });

        // Alerts Toggle
        document.getElementById('btnAlerts').addEventListener('click', () => {
            state.isAlertsOn = !state.isAlertsOn;
            document.getElementById('btnAlerts').classList.toggle('btn-active');
            document.getElementById('btnAlerts').textContent = state.isAlertsOn ? '🔔 تنبيهات' : '🔕 صامت';
        });

        // Share
        document.getElementById('btnShare').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({ title: 'Futures Signal Pro', text: 'منصة تحليل إشارات التداول', url: window.location.href });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ الرابط!');
            }
        });

        // Clear Log
        document.getElementById('clearLogBtn').addEventListener('click', () => {
            if (confirm('هل أنت متأكد من مسح سجل الصفقات؟')) {
                state.trades = [];
                localStorage.setItem('futures_trades', JSON.stringify(state.trades));
                updateStats();
                renderLog();
            }
        });

        // Telegram
        document.getElementById('tgToken').value = state.tgToken;
        document.getElementById('tgChatId').value = state.tgChatId;

        document.getElementById('tgSave').addEventListener('click', () => {
            state.tgToken = document.getElementById('tgToken').value.trim();
            state.tgChatId = document.getElementById('tgChatId').value.trim();
            localStorage.setItem('tg_token', state.tgToken);
            localStorage.setItem('tg_chat', state.tgChatId);
            document.getElementById('tgStatus').textContent = '✅ تم حفظ الإعدادات';
        });

        document.getElementById('tgTest').addEventListener('click', async () => {
            const token = document.getElementById('tgToken').value.trim();
            const chat = document.getElementById('tgChatId').value.trim();
            if (!token || !chat) { document.getElementById('tgStatus').textContent = '⚠️ يرجى إدخال Token و Chat ID'; return; }
            document.getElementById('tgStatus').textContent = 'جاري الاختبار...';
            try {
                const url = `https://api.telegram.org/bot${token}/sendMessage`;
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chat, text: '✅ اتصال ناجح من تطبيق Signal Pro!' })
                });
                if (res.ok) document.getElementById('tgStatus').textContent = '✅ تم الإرسال بنجاح';
                else document.getElementById('tgStatus').textContent = '❌ فشل الإرسال، تحقق من البيانات';
            } catch (e) {
                document.getElementById('tgStatus').textContent = '❌ خطأ: ' + e.message;
            }
        });

        // PWA Install
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-banner').classList.add('show');
        });
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    document.getElementById('pwa-banner').classList.remove('show');
                }
                deferredPrompt = null;
            }
        });
        document.getElementById('closeBanner').addEventListener('click', () => {
            document.getElementById('pwa-banner').classList.remove('show');
        });

        // ========================================================================
        // 10. INITIALIZATION
        // ========================================================================
        window.addEventListener('load', () => {
            loadData();
            updateStats();
            renderLog();
            document.getElementById('statFrameLabel').textContent = state.interval;
            // Auto-refresh every 5 minutes
            setInterval(() => {
                if (state.ws) state.ws.close();
                loadData();
            }, 300000);
        });

        // Handle resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => drawChart(state.candles), 300);
        });

        console.log('✅ Signal Pro Application Loaded successfully.');
        console.log('📊 Indicators integrated: ARBM, LiquidityEdge, Volume Profile, Market Structure.');
    </script>
</body>
