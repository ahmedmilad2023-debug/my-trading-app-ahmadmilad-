<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080C14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مِرصاد — منصة إشارات الفيوتشرز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#080C14; --panel:#0C1322; --panel2:#101A2E; --line:#1A2338; --line2:#232F4D;
  --txt:#E9EEF9; --dim:#8C99B9; --faint:#5B6885;
  --acc:#8B7CFF; --acc-dim:#5F54C4;
  --up:#2BD98B; --dn:#FF5D75; --wn:#F0B35C;
  --r:14px; --nav-h:62px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;max-width:100vw;overflow-x:hidden}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
.num,.mono{font-family:'JetBrains Mono',monospace;direction:ltr;unicode-bidi:isolate;letter-spacing:-.2px}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font-family:inherit;color:var(--txt)}
::-webkit-scrollbar{width:0;height:0}
.stale{opacity:.4}

/* ===== الهيدر ===== */
#hdr{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(8,12,20,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--acc)}
.brand b{font-size:16px;font-weight:800;letter-spacing:.3px}
.brand small{display:block;font-size:9.5px;color:var(--faint);font-weight:600;margin-top:-3px}
.conn{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:99px;border:1px solid var(--line2);color:var(--dim)}
.conn .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.conn.live{color:var(--up)} .conn.live .dot{background:var(--up);box-shadow:0 0 6px var(--up)}
.conn.re{color:var(--wn)} .conn.re .dot{background:var(--wn)}
.conn.re.pulse .dot{animation:bl 1s infinite}
.conn.off{color:var(--dn)} .conn.off .dot{background:var(--dn)}
@keyframes bl{50%{opacity:.25}}

/* ===== هيكل عام ===== */
#app{max-width:560px;margin:0 auto;padding:0 14px calc(var(--nav-h) + 26px + env(safe-area-inset-bottom))}
.view{display:none;animation:in .22s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-t h2{font-size:14.5px;font-weight:800}
.sec-t .sub{font-size:11px;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.hr{height:1px;background:var(--line);margin:12px 0}
.muted{color:var(--dim);font-size:12px}
.tiny{font-size:10.5px;color:var(--faint)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--dim)}
.empty svg{color:var(--faint);margin-bottom:8px}
.empty p{font-size:13px;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;font-weight:700;font-size:12.5px;background:var(--panel2);border:1px solid var(--line2);transition:.15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0A0D18}
.btn.dng{color:var(--dn);border-color:#3A2030}
.btn.blk{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}

/* ===== بطاقة BTC ===== */
.btc{display:flex;flex-direction:column;gap:10px}
.btc .top{display:flex;align-items:flex-start;justify-content:space-between}
.btc .px{font-size:24px;font-weight:700}
.btc .px .cur{font-size:11px;color:var(--faint);font-weight:600;margin-inline-start:4px}
.regime{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:99px;border:1px solid var(--line2)}
.regime.bull{color:var(--up);border-color:#173E30;background:rgba(43,217,139,.06)}
.regime.bear{color:var(--dn);border-color:#422232;background:rgba(255,93,117,.06)}
.regime.neut{color:var(--wn);border-color:#443A22;background:rgba(240,179,92,.06)}
.narr{font-size:12.5px;color:var(--dim);line-height:1.9;border-top:1px solid var(--line);padding-top:10px}
.warnbar{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:rgba(240,179,92,.07);border:1px solid #443A22;color:var(--wn);font-size:11.5px;font-weight:700}
.warnbar.off{background:rgba(255,93,117,.07);border-color:#422232;color:var(--dn)}
.srcrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);padding:7px 2px;border-bottom:1px solid var(--line)}
.srcrow:last-child{border:none}
.srcrow b{font-family:'JetBrains Mono';font-size:11px;color:var(--dim)}

/* ===== بطاقة الإشارة ===== */
.sig{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;animation:in .25s ease}
.sig .hd{display:flex;align-items:center;gap:8px}
.sig .sym{font-size:15px;font-weight:700}
.badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:7px;letter-spacing:.3px}
.badge.long{color:#0A0D18;background:var(--up)}
.badge.short{color:#fff;background:var(--dn)}
.chip-st{font-size:10px;font-weight:800;padding:3px 8px;border-radius:7px;border:1px solid var(--line2);color:var(--dim)}
.chip-st.open{color:var(--acc);border-color:var(--acc-dim)}
.chip-st.tp{color:var(--up);border-color:#173E30}
.chip-st.sl{color:var(--dn);border-color:#422232}
.chip-st.man{color:var(--dim)}
.ring{margin-inline-start:auto;position:relative;width:40px;height:40px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:'JetBrains Mono';font-size:11px;font-weight:700}
.sig .ot{font-size:10.5px;color:var(--faint);margin-top:2px}
.pxrow{display:flex;align-items:flex-end;justify-content:space-between;margin:12px 0 10px;gap:8px}
.pxrow .lbl{display:block;font-size:10px;color:var(--faint);font-weight:700;margin-bottom:2px}
.pxrow .cur{font-size:22px;font-weight:700;transition:color .2s}
.pxrow .cur.up{color:var(--up)} .pxrow .cur.dn{color:var(--dn)}
.pxrow .plv{font-size:17px;font-weight:700}
.pxrow .plv.up{color:var(--up)} .pxrow .plv.dn{color:var(--dn)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.cell .lbl{display:block;font-size:9.5px;color:var(--faint);font-weight:700;margin-bottom:1px}
.cell .v{font-family:'JetBrains Mono';font-size:12.5px;font-weight:600;direction:ltr;unicode-bidi:isolate}
.cell.sl .v{color:var(--dn)} .cell.tp .v{color:var(--up)}
.tfchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tfc{font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--dim)}
.tfc.up{color:var(--up)} .tfc.dn{color:var(--dn)}
.reason{font-size:12px;color:var(--dim);line-height:1.9;margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.sig .acts{display:flex;gap:8px;margin-top:12px}
.sig .acts .btn{flex:1;padding:8px}
.est{font-size:10px;color:var(--faint)}

/* ===== السكانر ===== */
.scanbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.scanbar .info{flex:1;font-size:11px;color:var(--faint)}
.prog{height:3px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.sumrow{display:flex;gap:8px;margin-bottom:12px}
.schip{flex:1;text-align:center;padding:8px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.schip b{display:block;font-family:'JetBrains Mono';font-size:16px}
.schip span{font-size:10px;color:var(--faint);font-weight:700}
.schip.g b{color:var(--up)} .schip.r b{color:var(--dn)} .schip.n b{color:var(--dim)}
.srow{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;width:100%;text-align:right}
.srow:active{background:var(--panel2)}
.srow .l{flex:1;min-width:0}
.srow .sym{font-weight:700;font-size:13px}
.srow .sub{font-size:10px;color:var(--faint);display:flex;gap:5px;margin-top:2px;flex-wrap:wrap}
.srow .r{text-align:left}
.srow .p{font-family:'JetBrains Mono';font-size:12.5px;font-weight:600;direction:ltr}
.srow .pc{font-family:'JetBrains Mono';font-size:10.5px;direction:ltr}
.pc.up{color:var(--up)} .pc.dn{color:var(--dn)}
.stag{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px}
.stag.rdy-l{background:rgba(43,217,139,.12);color:var(--up)}
.stag.rdy-s{background:rgba(255,93,117,.12);color:var(--dn)}
.stag.near{background:rgba(240,179,92,.1);color:var(--wn)}
.stag.no{background:var(--panel2);color:var(--faint)}

/* ===== التبويبات ===== */
.tabs{display:flex;gap:6px;margin:10px 0}
.tab{flex:1;padding:7px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--dim)}
.tab.on{color:var(--txt);border-color:var(--acc-dim);background:var(--panel2)}

/* ===== التفاصيل ===== */
#detail{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}
#detail.on{display:flex}
#detail .dhd{display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line);background:rgba(8,12,20,.9)}
#detail .dhd .sym{font-size:16px;font-weight:800}
#detail .dbody{flex:1;overflow-y:auto;padding:14px 14px 40px;max-width:560px;margin:0 auto;width:100%}
#chartWrap{position:relative;width:100%;height:300px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
#chart{position:absolute;inset:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--faint)}
.legend i{display:inline-block;width:8px;height:3px;border-radius:2px;margin-inline-end:4px;vertical-align:middle}
.gate{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-size:12px}
.gate:last-child{border:none}
.gate .ok{color:var(--up);font-weight:800;font-family:'JetBrains Mono';font-size:11px}
.gate .no{color:var(--faint);font-family:'JetBrains Mono';font-size:11px}
.lvl{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;font-size:12px;border-bottom:1px solid var(--line)}
.lvl:last-child{border:none}
.qbar{width:64px;height:4px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:3px}
.qbar i{display:block;height:100%;background:var(--acc)}

/* ===== السجل والإحصاءات ===== */
.statg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.stat b{display:block;font-family:'JetBrains Mono';font-size:14.5px;direction:ltr;text-align:right}
.stat span{font-size:9.5px;color:var(--faint);font-weight:700}
.trow{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.trow>summary{list-style:none;display:flex;align-items:center;gap:9px;padding:11px 13px;cursor:pointer}
.trow>summary::-webkit-details-marker{display:none}
.res{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:6px}
.res.WIN{background:rgba(43,217,139,.12);color:var(--up)}
.res.LOSS{background:rgba(255,93,117,.12);color:var(--dn)}
.res.MANUAL{background:var(--panel2);color:var(--dim)}
.res.INVALID{background:rgba(240,179,92,.1);color:var(--wn)}
.tbody{padding:0 13px 12px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:9px}
.tbody .kv{display:flex;justify-content:space-between;padding:3px 0}
.evt{font-family:'JetBrains Mono';font-size:9.5px;color:var(--faint);direction:ltr;text-align:left;padding:2px 0}

/* ===== الإعدادات ===== */
.set-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:20px 2px 9px;color:var(--txt)}
.set-h svg{color:var(--acc)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.frow:last-child{border:none}
.frow .fl{font-size:12.5px;font-weight:600}
.frow .fs{font-size:10.5px;color:var(--faint)}
.inp{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;font-size:13px;outline:none}
.inp:focus{border-color:var(--acc-dim)}
.inp.num{font-size:12.5px}
.sw{position:relative;width:42px;height:24px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--line2);border-radius:99px;transition:.2s}
.sw i:before{content:'';position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--faint);transition:.2s}
.sw input:checked+i{background:var(--acc-dim);border-color:var(--acc-dim)}
.sw input:checked+i:before{transform:translateX(-18px);background:#fff}
[dir="ltr"] .sw input:checked+i:before{transform:translateX(18px)}
.crow{display:flex;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid var(--line)}
.crow .csym{font-family:'JetBrains Mono';font-size:12px;font-weight:600;flex:1;direction:ltr;text-align:left}
.icobtn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line2);color:var(--dim)}
.icobtn:active{background:var(--panel2)}
.icobtn.dis{color:var(--faint);opacity:.5}
.slider{width:100%;appearance:none;height:4px;background:var(--panel2);border-radius:99px;outline:none}
.slider::-webkit-slider-thumb{appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}

/* ===== نافذة / توست ===== */
#modal{position:fixed;inset:0;z-index:90;background:rgba(4,6,12,.7);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line2);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#modal h3{font-size:15px;font-weight:800;margin-bottom:10px}
#toasts{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:var(--panel2);border:1px solid var(--line2);border-radius:11px;padding:10px 14px;font-size:12.5px;font-weight:600;display:flex;gap:8px;align-items:center;animation:in .2s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.ok{border-color:#173E30}.toast.ok svg{color:var(--up)}
.toast.er{border-color:#422232}.toast.er svg{color:var(--dn)}

/* ===== شاشة البداية ===== */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#splash .logo{width:64px;height:64px;border-radius:18px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--acc);animation:pulse 2s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(139,124,255,.05)}}
#splash h1{font-size:22px;font-weight:800}
#splash .tag{font-size:11.5px;color:var(--faint);margin-top:-12px}
#bootLog{font-family:'JetBrains Mono';font-size:10.5px;color:var(--faint);direction:ltr;text-align:left;min-height:90px;width:290px}
#bootLog div{animation:in .3s}
#bootLog .done{color:var(--up)}
#bootLog .warn{color:var(--wn)}

/* ===== التنقل ===== */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;background:rgba(8,12,20,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{display:flex;width:100%;max-width:560px}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--faint);font-size:10px;font-weight:700;transition:.15s}
.nv.on{color:var(--acc)}
.disc{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.8;padding:12px 8px;border-top:1px solid var(--line);margin-top:18px}
.engine-line{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;color:var(--faint);padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-top:12px;background:var(--panel)}
</style>
</head>
<body>

<div id="splash">
  <div class="logo" id="splashLogo"></div>
  <h1>مِرصاد</h1>
  <div class="tag">منصة إشارات الفيوتشرز — بيانات Bybit الحقيقية</div>
  <div id="bootLog"></div>
</div>

<header id="hdr">
  <div class="brand">
    <div class="logo" id="hdrLogo"></div>
    <div><b>مِرصاد</b><small>محرّك هيكل 1D · 4H · 1H</small></div>
  </div>
  <div class="conn" id="conn" title=""><span class="dot"></span><span id="connTxt">جارٍ الاتصال</span></div>
</header>

<div style="max-width:560px;margin:0 auto;padding:0 14px"><div class="warnbar" id="freezeBar" style="display:none;margin-top:12px"></div></div>

<main id="app">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-scanner"></section>
  <section class="view" id="v-history"></section>
  <section class="view" id="v-settings"></section>
</main>

<div id="detail">
  <div class="dhd">
    <button class="icobtn" data-act="close-detail"></button>
    <div style="flex:1"><div class="sym num" id="dSym">—</div><div class="tiny" id="dSub"></div></div>
    <button class="icobtn" data-act="refresh-chart" title="تحديث الشارت">↻</button>
    <div style="text-align:left"><div class="num" id="dPx" style="font-size:16px;font-weight:700">—</div><div class="tiny num" id="dPct"></div></div>
  </div>
  <div class="dbody" id="dBody"></div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toasts"></div>

<nav id="nav"><div class="in" id="navIn"></div></nav>

<script>
'use strict';
(()=>{

/* منع انهيار التطبيق بسبب أي خطأ غير متوقع — يُسجَّل فقط ولا يُوقف الطبقات الأخرى */
window.addEventListener('error',e=>console.warn('[mirsad] error:',e.message));
window.addEventListener('unhandledrejection',e=>{console.warn('[mirsad] unhandled:',e.reason&&e.reason.message||e.reason);});

/* ============================================================
   01 — أدوات عامة
============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ============================================================
   04 — Bybit REST (V5 — عام، بدون مفاتيح، مهلة + إعادة محاولة)
============================================================ */
const Bybit={
  REST:'https://api.bybit.com/v5/market', inst:{}, tickers:{}, healthy:false,
  async api(path,params,tries=2){
    let lastErr;
    for(let i=0;i<tries;i++){
      const u=new URL(this.REST+path);
      Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),10000);
      try{
        const r=await fetch(u,{cache:'no-store',signal:ctl.signal});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const j=await r.json();
        if(j.retCode!==0) throw new Error(j.retMsg||('retCode '+j.retCode));
        return j.result;
      }catch(e){ lastErr=e; if(i<tries-1) await new Promise(r=>setTimeout(r,600)); }
      finally{ clearTimeout(to); }
    }
    throw lastErr;
  },
  async loadInstruments(){
    this.inst={}; let cursor='';
    for(let page=0;page<5;page++){
      const p={category:'linear',limit:'1000'}; if(cursor)p.cursor=cursor;
      const res=await this.api('/instruments-info',p);
      for(const it of (res.list||[])){
        if(it.status!=='Trading') continue;
        this.inst[it.symbol]={tickStr:it.priceFilter.tickSize,tick:+it.priceFilter.tickSize,
          qtyStep:+(it.lotSizeFilter&&it.lotSizeFilter.qtyStep||1),
          minQty:+(it.lotSizeFilter&&it.lotSizeFilter.minOrderQty||0)};
      }
      cursor=res.nextPageCursor||''; if(!cursor)break;
    }
    this.healthy=Object.keys(this.inst).length>0;
    if(!this.healthy) throw new Error('قائمة الأدوات فارغة');
  },
  async refreshTickers(){
    const res=await this.api('/tickers',{category:'linear'});
    for(const t of (res.list||[])){
      const lp=t.lastPrice!=null?+t.lastPrice:null;
      const pct=t.price24hPcnt!=null?+t.price24hPcnt*100:null;
      const prev=this.tickers[t.symbol]||{};
      this.tickers[t.symbol]={lastPrice:lp,pct24:pct!=null?pct:(prev.pct24||0),turnover:+(t.turnover24h||prev.turnover||0)};
      if(lp!=null) MD.updatePrice(t.symbol,lp,pct);
    }
  },
  async klines(symbol,interval,limit){
    const res=await this.api('/kline',{category:'linear',symbol,interval,limit:String(limit)});
    return (res.list||[]).map(a=>({t:+a[0],o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5]})).sort((a,b)=>a.t-b.t);
  },
  price(sym){return MD.price(sym)},
  pct(sym){return MD.pct(sym)},
};

/* ============================================================
   05 — MarketDataService (الطبقة المركزية)
   WebSocket مباشر + REST Fallback تلقائي + Reconnect + Heartbeat
   الوضع LIVE فقط عند وصول بيانات فعلية. لا بيانات وهمية إطلاقًا.
============================================================ */
const MD={
  HOSTS:['wss://stream.bybit.com/v5/public/linear','wss://stream.bytick.com/v5/public/linear'],
  prices:{},            // sym -> {p,pct,ts}
  mode:'boot',          // boot | live | fallback | off
  wsState:'closed',     // closed | connecting | open
  ws:null, gen:0, retry:0, hostIdx:0,
  want:new Set(), lastMsg:0, lastPoll:0, pollFails:0,
  pollTimer:null, pingTimer:null, stallTimer:null, openTo:null,
  price(s){const q=this.prices[s];return q&&q.p?q.p:null},
  pct(s){const q=this.prices[s];return q&&q.pct!=null?q.pct:(Bybit.tickers[s]&&Bybit.tickers[s].pct24||0)},
  stale(s,ms=25000){const q=this.prices[s];return !(q&&q.ts&&Date.now()-q.ts<ms)},
  updatePrice(sym,p,pct){
    if(p==null||!isFinite(p))return;
    const q=this.prices[sym]||(this.prices[sym]={});
    const changed=q.p!==p;
    q.p=p; q.ts=Date.now(); if(pct!=null)q.pct=pct;
    if(changed) Signals.onPriceTick(sym,p);
  },
  modeTxt(){return {live:'مباشر — WebSocket',fallback:'REST FALLBACK',off:'غير متصل',boot:'جارٍ الاتصال'}[this.mode]},
  setMode(m){
    const prev=this.mode; if(prev===m)return;
    this.mode=m;
    if(UI.conn)UI.conn(); if(UI.freeze)UI.freeze();
    if(UI.refreshIf)UI.refreshIf(['settings']);
    if(prev==='live'&&m==='fallback') toast('تحوّل النظام إلى وضع REST — التطبيق مستمر بالعمل','er');
    if(m==='off') toast('انقطع الاتصال بالسوق — لا تُعرض أسعار الآن','er');
    if(m==='live'&&prev!=='boot') toast('البث المباشر للسوق مستأنف — دون إعادة تحميل');
  },
  init(){
    this.startPoll();          // يعمل دائمًا كطبقة أمان ومصدر بديل
    this.connect();            // محاولة بث مباشر غير حاجبة
    this.stallTimer=setInterval(()=>this.watchdog(),10000);
  },
  /* --- REST polling: كل 5 ثوانٍ — طلب واحد لكل الرموز --- */
  startPoll(){ if(this.pollTimer)return;
    this.pollTimer=setInterval(()=>this.pollTick().catch(()=>{}),5000);
    this.pollTick().catch(()=>{}); },
  async pollTick(){
    try{
      if(!Bybit.healthy) await Bybit.loadInstruments();   // شفاء ذاتي لو فشلت عند الإقلاع
      await Bybit.refreshTickers();
      this.pollFails=0; this.lastPoll=Date.now();
      if(this.mode!=='live') this.setMode('fallback');
    }catch(e){
      this.pollFails++; console.warn('[md] poll fail #'+this.pollFails, e.message);
      if(this.mode!=='live'&&this.pollFails>=3) this.setMode('off');
    }
  },
  /* --- WebSocket مع مهلة اتصال 8ث وBackoff 1s→30s وتناوب مضيفين --- */
  connect(){
    if(this.ws){ const old=this.ws; this.ws=null;
      try{old.onopen=old.onmessage=old.onclose=old.onerror=null;old.close();}catch(e){} }
    clearTimeout(this.openTo); clearInterval(this.pingTimer);
    const gen=++this.gen;
    this.wsState='connecting'; UI.conn&&UI.conn();
    const url=this.HOSTS[this.hostIdx%this.HOSTS.length];
    let ws;
    try{ ws=new WebSocket(url); }
    catch(e){ console.warn('[md] ws blocked by environment:',e.message); this.fail(gen); return; }
    this.ws=ws;
    this.openTo=setTimeout(()=>{ if(gen!==this.gen)return;
      console.warn('[md] websocket connect timeout (8s) → REST fallback');
      try{ws.close()}catch(e){} this.fail(gen); },8000);
    ws.onopen=()=>{ if(gen!==this.gen)return;
      clearTimeout(this.openTo);
      this.wsState='open'; this.retry=0; this.lastMsg=Date.now();
      console.log('[md] websocket LIVE:',url);
      this.setMode('live');
      this.resub();
      this.pingTimer=setInterval(()=>{ if(this.ws&&this.ws.readyState===1)
        this.ws.send(JSON.stringify({op:'ping'})); },18000);
    };
    ws.onmessage=ev=>{ if(gen!==this.gen)return;
      this.lastMsg=Date.now();
      let m; try{ m=JSON.parse(ev.data); }catch(_){ return; }
      try{ this.handle(m); }catch(e){ console.warn('[md] message parse:',e); }
    };
    ws.onclose=()=>{ if(gen!==this.gen)return;
      clearTimeout(this.openTo); clearInterval(this.pingTimer);
      this.wsState='closed';
      console.warn('[md] websocket closed');
      this.fail(gen);
    };
    ws.onerror=()=>{ /* onclose سيتكفل */ };
  },
  fail(gen){
    if(gen!==this.gen)return;
    this.ws=null;
    const delay=Math.min(30000,1000*Math.pow(2,this.retry++));
    this.hostIdx++; // تناوب المضيف البديل عند الفشل المتكرر
    if(this.mode!=='live') this.setMode(this.pollFails<3?'fallback':'off');
    console.warn('[md] reconnect scheduled in',delay,'ms');
    setTimeout(()=>{ if(gen===this.gen&&this.wsState!=='open') this.connect(); },delay);
  },
  watchdog(){ // كشف اتصال "ميت": لا رسائل 45 ثانية → قطع وإعادة
    if(this.mode==='live'&&this.ws&&Date.now()-this.lastMsg>45000){
      console.warn('[md] stall 45s → force reconnect');
      try{this.ws.close()}catch(e){}
    }
  },
  /* --- Parsing حقيقي لرسائل Bybit V5: op / success / ret_msg / topic / data --- */
  handle(m){
    if(m.op==='pong'||m.op==='ping') return;
    if(m.op==='subscribe'||m.op==='unsubscribe'){
      if(m.success===false) console.warn('[md] sub rejected:',m.ret_msg,m.args);
      return;
    }
    if(!m.topic) return; // رسالة غير متوقعة → تُسجَّل وتُتجاهل
    const dot=m.topic.indexOf('.'); const kind=m.topic.slice(0,dot); const rest=m.topic.slice(dot+1);
    if(kind==='tickers'){
      const sym=rest, d=m.data||{};
      const p=d.lastPrice!=null?+d.lastPrice:null;
      const pct=d.price24hPcnt!=null?+d.price24hPcnt*100:null;
      if(p!=null){ const t=Bybit.tickers[sym]; if(t)t.lastPrice=p; this.updatePrice(sym,p,pct); }
      else if(pct!=null){ const q=this.prices[sym]; if(q)q.pct=pct; }
      if(d.turnover24h!=null){ const t=Bybit.tickers[sym]=(Bybit.tickers[sym]||{}); t.turnover=+d.turnover24h; }
    }
    else if(kind==='kline'){
      const pd=rest.indexOf('.'); const tf=rest.slice(0,pd); const sym=rest.slice(pd+1);
      for(const it of (m.data||[])){
        const c={t:+it.start,o:+it.open,h:+it.high,l:+it.low,c:+it.close};
        if(!c.t||!isFinite(c.c)) continue;
        const conf=it.confirm===true||it.confirm==='true';
        if(conf) Signals.onClosedCandle(sym,tf,c);
        else ChartCtl.onKlineTick(sym,tf,c);
      }
    }
  },
  sub(topics){ topics.forEach(t=>this.want.add(t));
    if(this.ws&&this.ws.readyState===1) this.sendSub(topics); },
  unsub(topics){ topics.forEach(t=>this.want.delete(t));
    if(this.ws&&this.ws.readyState===1){ for(let i=0;i<topics.length;i+=10)
      this.ws.send(JSON.stringify({op:'unsubscribe',args:topics.slice(i,i+10)})); } },
  resub(){ const a=[...this.want]; for(let i=0;i<a.length;i+=10)
    this.ws.send(JSON.stringify({op:'subscribe',args:a.slice(i,i+10)})); },
  sendSub(list){ for(let i=0;i<list.length;i+=10)
    this.ws.send(JSON.stringify({op:'subscribe',args:list.slice(i,i+10)})); },
  watchSignal(sym){ this.sub(['tickers.'+sym,'kline.60.'+sym,'kline.D.'+sym]); },
  unwatchKlines(sym){ if(!Store.openBySymbol(sym))
    this.unsub(['kline.60.'+sym,'kline.240.'+sym,'kline.D.'+sym]); },
  snapshot(){ const h=this.HOSTS[this.hostIdx%this.HOSTS.length];
    return {mode:this.modeTxt(),wsState:this.wsState,host:h.replace('wss://',''),
      retry:this.retry,
      lastMsg:this.lastMsg?Math.round((Date.now()-this.lastMsg)/1000)+'s':'—',
      lastPoll:this.lastPoll?Math.round((Date.now()-this.lastPoll)/1000)+'s':'—',
      pollFails:this.pollFails,cached:Object.keys(this.prices).length,
      inst:Object.keys(Bybit.inst).length}; }
};

/* ============================================================
   06 — التحليل الفني: ATR / Swings / مناطق / خطوط اتجاه
   (محرك الوثيقة الأولى — دون تغيير)
============================================================ */
const TA={
  atr(C,p=14){ if(C.length<3)return 0; const trs=[];
    for(let i=1;i<C.length;i++) trs.push(Math.max(C[i].h-C[i].l,Math.abs(C[i].h-C[i-1].c),Math.abs(C[i].l-C[i-1].c)));
    const n=Math.min(p,trs.length); let a=0; for(let i=trs.length-n;i<trs.length;i++)a+=trs[i]; a/=n;
    for(let i=trs.length-n-1;i>=0;i--) a=(a*(n-1)+trs[i])/n; return a; },
  swings(C,k=3){ const highs=[],lows=[];
    for(let i=k;i<C.length-k;i++){ let H=true,L=true;
      for(let j=1;j<=k;j++){ if(C[i].h<=C[i-j].h||C[i].h<=C[i+j].h)H=false;
        if(C[i].l>=C[i-j].l||C[i].l>=C[i+j].l)L=false; if(!H&&!L)break; }
      if(H)highs.push({i,t:C[i].t,p:C[i].h}); if(L)lows.push({i,t:C[i].t,p:C[i].l}); }
    return {highs,lows}; },
  zones(pivots,atr,C){ if(!pivots.length)return [];
    const price=C[C.length-1].c, tol=Math.max(atr*0.8,price*0.006), cl=[];
    for(const pv of pivots){ const f=cl.find(c=>Math.abs(c.avg-pv.p)<=tol);
      if(f){f.members.push(pv);f.avg=f.members.reduce((s,m)=>s+m.p,0)/f.members.length;f.lastIdx=Math.max(f.lastIdx,pv.i);}
      else cl.push({members:[pv],avg:pv.p,lastIdx:pv.i}); }
    return cl.map(c=>({low:Math.min(...c.members.map(m=>m.p))-0.3*atr,
      high:Math.max(...c.members.map(m=>m.p))+0.3*atr,
      touches:c.members.length,lastIdx:c.lastIdx,mid:c.avg})).sort((a,b)=>a.mid-b.mid); },
  line(p1,p2){ const slope=(p2.p-p1.p)/(p2.t-p1.t);
    return {t1:p1.t,p1:p1.p,t2:p2.t,p2:p2.p,slope,at:t=>p1.p+slope*(t-p1.t)}; },
  quality(line,pivots,C,atr,kind){ if(!pivots.length)return 0;
    const tf=C.tfMs,tEnd=C[C.length-1].t,aT=line.t1;
    const tol=Math.max(atr*0.6,line.at(tEnd)*0.0015);
    let touches=0,lastTouch=0;
    for(const pv of pivots){ if(pv.t<aT-2*tf)continue;
      if(Math.abs(pv.p-line.at(pv.t))<=tol){touches++;lastTouch=Math.max(lastTouch,pv.t);} }
    let pen=0; for(const c of C){ if(c.t<aT)continue; const lv=line.at(c.t);
      if(kind==='support'&&c.l<lv-0.8*atr)pen++;
      if(kind==='resistance'&&c.h>lv+0.8*atr)pen++; }
    const ago=(tEnd-lastTouch)/tf;
    let s=34+Math.min(touches,4)*13-Math.min(pen,3)*15+(ago<=24?16:ago<=48?8:0);
    return clamp(Math.round(s),0,100); }
};
function trendLabel(sw){ const h=sw.highs,l=sw.lows; if(h.length<2||l.length<2)return 'side';
  const up=h[h.length-1].p>h[h.length-2].p&&l[l.length-1].p>l[l.length-2].p;
  const dn=h[h.length-1].p<h[h.length-2].p&&l[l.length-1].p<l[l.length-2].p;
  return up?'up':dn?'dn':'side'; }
function compRet(D,H4,H1){ const r=(a,n)=>a.length>n? (a[a.length-1].c-a[a.length-1-n].c)/a[a.length-1-n].c : 0;
  return r(D,3)*0.5+r(H4,6)*0.3+r(H1,12)*0.2; }
function rsScore(coinR,btcR,dir){ const rs=coinR-btcR, s=dir==='LONG'?rs:-rs;
  return s>=0.03?5:s>=0.012?4:s>=0?3:s>=-0.012?2:1; }

/* ============================================================
   07 — محرك الاستراتيجية (1D → 4H → 1H) — دون تغيير منطقي
============================================================ */
function analyze1H(ctx,dir){
  const {H1,sw1,atr1}=ctx, sgn=dir==='LONG'?1:-1;
  const H=sw1.highs,L=sw1.lows;
  if(H.length<2||L.length<2) return {ok:false,why:'نقاط ارتكاز غير كافية على فريم الساعة'};
  const hh=H[H.length-1].p>H[H.length-2].p, hl=L[L.length-1].p>L[L.length-2].p;
  const ll=H[H.length-1].p<H[H.length-2].p, lh=L[L.length-1].p<L[L.length-2].p;
  if(dir==='LONG'&&!(hh&&hl)) return {ok:false,why:'فريم الساعة لا يُظهر قمة أعلى + قاع أعلى (HH+HL)'};
  if(dir==='SHORT'&&!(ll&&lh)) return {ok:false,why:'فريم الساعة لا يُظهر قمة أدنى + قاع أدنى (LH+LL)'};
  const supLine=TA.line(L[L.length-2],L[L.length-1]);
  const resLine=TA.line(H[H.length-2],H[H.length-1]);
  if(dir==='LONG'&&(supLine.slope<=0||resLine.slope<=0))
    return {ok:false,why:'لا تتوفر قناة صاعدة موثوقة على فريم الساعة'};
  if(dir==='SHORT'&&(supLine.slope>=0||resLine.slope>=0))
    return {ok:false,why:'لا تتوفر قناة هابطة موثوقة على فريم الساعة'};
  const supQ=TA.quality(supLine,L,H1,atr1,'support');
  const resQ=TA.quality(resLine,H,H1,atr1,'resistance');
  if(supQ<70||resQ<70)
    return {ok:false,why:`جودة خطوط الاتجاه منخفضة (دعم ${supQ}/100 · مقاومة ${resQ}/100 — المطلوب 70+)`,supQ,resQ};
  const HLgap=Math.abs(L[L.length-1].p-L[L.length-2].p)/atr1;
  const HHgap=Math.abs(H[H.length-1].p-H[H.length-2].p)/atr1;
  let score=8+(HLgap>=0.8?6:3)+(HHgap>=0.8?6:3);
  return {ok:true,supLine,resLine,supQ,resQ,score:Math.min(20,score)};
}

function evalSide(ctx,dir){
  const sgn=dir==='LONG'?1:-1;
  const {price,atrD,atr4,atr1,D,H4,H1,sw4,supZ,resZ,tick}=ctx;
  const g={daily:false,accept2:false,h4:false,h1:false,lines:false,rr:false,all:false};
  const miss=[]; const out={dir,gates:g,missing:miss,confidence:0};
  const close=D[D.length-1].c, prev=D[D.length-2].c;

  /* ---- المرحلة 1: السياق اليومي (منطقة + قبول) ---- */
  let zone=null,boundary=null;
  { const zones=sgn>0?supZ:resZ;
    const acc=[];
    for(const z of zones){
      if(z.touches<2||z.lastIdx<D.length-70) continue;
      const b=sgn>0?z.high:z.low;
      if(!(sgn*close>sgn*b)) continue;
      if(sgn*(close-b)>6*atrD) continue;
      const hb=sgn>0?z.low:z.high;
      if(!D.slice(z.lastIdx+1).every(c=>sgn*c.c>sgn*hb)) continue;
      acc.push({z,b});
    }
    acc.sort((a,b)=>sgn*(a.b-close)-sgn*(b.b-close));
    if(!acc.length) miss.push(sgn>0?'لا توجد منطقة دعم يومية حقيقية مع قبول سعري حالي':'لا توجد منطقة مقاومة يومية حقيقية مع رفض سعري حالي');
    else{ zone=acc[0].z; boundary=acc[0].b; g.daily=true;
      g.accept2=sgn*prev>sgn*boundary;
      if(!g.accept2) miss.push('القبول اليومي بإغلاق واحد فقط (يُفضَّل إغلاقان)'); } }

  /* ---- المرحلة 2: تأكيد 4H (كسر بالإغلاق فقط) ---- */
  let brk=null,retest=false;
  { const piv=sgn>0?sw4.highs:sw4.lows, n=H4.length;
    for(let b=n-1;b>=Math.max(1,n-8);b--){
      let p=null; for(let k=piv.length-1;k>=0;k--){ if(piv[k].i<b){p=piv[k];break;} }
      if(!p) continue;
      const broke=sgn>0?(H4[b].c>p.p&&H4[b-1].c<=p.p):(H4[b].c<p.p&&H4[b-1].c>=p.p);
      if(!broke) continue;
      const thr=p.p-sgn*0.5*atr4; let held=true;
      for(let j=b;j<n;j++){ if(sgn*H4[j].c<sgn*thr){held=false;break;} }
      if(!held) break;
      if(piv.length>=2&&sgn*(piv[piv.length-1].p-piv[piv.length-2].p)>0){ brk={level:p.p,barsAgo:n-1-b,struct:true}; }
      else brk={level:p.p,barsAgo:n-1-b,struct:false};
      for(let j=b+1;j<n;j++){ const d=sgn*(p.p-H4[j].l); if(d>0&&d<=0.6*atr4){retest=true;break;} }
      break;
    }
    if(!brk) miss.push(sgn>0?'لا يوجد كسر مقاومة / BOS صاعد مؤكد بإغلاق شمعة 4 ساعات':'لا يوجد كسر دعم / BOS هابط مؤكد بإغلاق شمعة 4 ساعات');
    else g.h4=true; }

  /* ---- المرحلة 3: اتجاه 1H + خطوط الاتجاه ---- */
  const tr=analyze1H(ctx,dir); out.tr=tr;
  if(!tr.ok) miss.push(tr.why); else {g.h1=true;g.lines=true;}

  out.zone=zone; out.brk=brk;
  if(!(g.daily&&g.h4&&g.h1)){ out.reason=buildNarrative(ctx,out,null); return out; }

  /* ---- SL: خلف خط اتجاه 1H + Buffer من ATR ---- */
  const entry=price;
  const slLine=sgn>0?tr.supLine:tr.resLine;
  const lineNow=slLine.at(Date.now());
  if(sgn*(entry-lineNow)<0.6*atr1){ miss.push('السعر ملتصق بخط الاتجاه — مسافة وقف غير آمنة'); out.reason=buildNarrative(ctx,out,null); return out; }
  const buffer=1.25*atr1;
  const sl=roundTick(lineNow-sgn*buffer,tick,sgn>0?'down':'up');
  const risk=sgn*(entry-sl);
  if(!(risk>0)){ miss.push('قيمة وقف غير صالحة'); out.reason=buildNarrative(ctx,out,null); return out; }

  /* ---- TP: هدف هيكلي يومي + بوابة R:R >= 2 ---- */
  const tzones=sgn>0?resZ:[...supZ].reverse();
  let tp=null,tpz=null;
  for(const z of tzones){ const edge=sgn>0?z.low:z.high;
    if(sgn*(edge-entry)<=0.5*atr1) continue;
    const t=edge-sgn*0.25*atrD;
    if(sgn*(t-entry)>0){tp=t;tpz=z;break;} }
  let tpLbl=null;
  if(tp==null){ const win=D.slice(-41,-1);
    if(sgn>0){const pdh=Math.max(...win.map(c=>c.h)); if(sgn*(pdh-entry)>0){tp=roundTick(pdh-0.1*atrD,tick,'down');tpLbl='قمة يومية سابقة';}}
    else{const pdl=Math.min(...win.map(c=>c.l)); if(sgn*(pdl-entry)<0){tp=roundTick(pdl+0.1*atrD,tick,'up');tpLbl='قاع يومي سابق';}} }
  else tpLbl=sgn>0?'حافة مقاومة يومية':'حافة دعم يومي';
  if(tp==null||sgn*(tp-entry)<=0){ miss.push('لا يوجد هدف هيكلي يومي في الاتجاه المطلوب'); out.reason=buildNarrative(ctx,out,null); return out; }
  const rr=sgn*(tp-entry)/risk; out.rrVal=rr;
  if(rr<2){ miss.push(`نسبة العائد/المخاطرة غير كافية (${rr.toFixed(2)} < 2.0) — لا تُصدر إشارة`); out.reason=buildNarrative(ctx,out,null); return out; }
  g.rr=true; g.all=true;

  /* ---- Confidence (الأوزان الحرفية للوثيقة) ---- */
  const pDaily=20*((zone.touches>=3?0.4:0.25)+(g.accept2?0.4:0.22)+(sgn*(close-boundary)<=1.5*atrD?0.2:0.1));
  const p4=20*((brk.barsAgo<=1?0.5:brk.barsAgo<=4?0.35:0.2)+(brk.struct?0.3:0.15)+(retest?0.2:0.1));
  const p1=tr.score;
  const pTrend=(tr.supQ+tr.resQ)/200*15;
  const pRR=rr>=3?10:rr>=2.5?8:6;
  const btc=ctx.btc||{regime:'NEUTRAL',coinR:0};
  const btcAl=(btc.regime==='BULLISH'&&dir==='LONG')||(btc.regime==='BEARISH'&&dir==='SHORT');
  const pBTC=btcAl?5:(btc.regime==='NEUTRAL'?3:1);
  const pRS=rsScore(ctx.coinR,btc.coinR,dir);
  const pLiq=ctx.liq||3;
  const conf=Math.round(pDaily+p4+p1+pTrend+pRR+pBTC+pRS+pLiq);
  out.confidence=conf; out.entry=entry; out.sl=sl; out.tp=tp; out.rr=rr;
  out.parts={pDaily,p4,p1,pTrend,pRR,pBTC,pRS,pLiq};
  out.tpLbl=tpLbl; out.retest=retest; out.bufferAtr=buffer/atr1;
  /* نقاط ارتكاز خط SL الحقيقية — تُخزَّن immutable مع الإشارة */
  out.slLine={t1:slLine.t1,p1:slLine.p1,t2:slLine.t2,p2:slLine.p2};
  out.reason=buildNarrative(ctx,out,{zone,boundary,tp,tpz,tpLbl,rr,risk,slLine,lineNow,buffer});
  return out;
}

/* سرد المحرك — نص عربي مبني حصريًا على نتائج الحساب */
function buildNarrative(ctx,out,x){
  const f=p=>fmtP(ctx.sym,p);
  const sgn=out.dir==='LONG'?1:-1;
  const side=sgn>0?'دعم':'مقاومة';
  let s='';
  if(out.zone){ const z=out.zone,b=x?x.boundary:(sgn>0?z.high:z.low);
    s+=`السعر يحافظ على ${side} يومي عند ${f(z.low)}–${f(z.high)} (${z.touches} لمسات) مع ${out.gates.accept2?'إغلاقَين يوميَين':'إغلاق يومي'} مؤكد للقبول عند ${f(b)}. `; }
  else { const zs=sgn>0?ctx.supZ:ctx.resZ; const n=zs[zs.length-1];
    if(n) s+=`أقرب ${side} يومي عند ${f(n.low)}–${f(n.high)} دون قبول/رفض سعري مؤكد حتى الآن. `; }
  if(out.brk) s+=`فريم 4 ساعات أكّد ${out.brk.struct?'كسرًا هيكليًا (BOS)':'كسر مستوى'} عند ${f(out.brk.level)} بالإغلاق قبل ${out.brk.barsAgo*4} ساعة. `;
  else s+=`فريم 4 ساعات لا يُظهر كسرًا مؤكدًا بالإغلاق حتى الآن. `;
  if(out.tr&&out.tr.ok) s+=`فريم الساعة داخل قناة ${sgn>0?'صاعدة':'هابطة'} (جودة خط الدعم ${out.tr.supQ}/100 وخط المقاومة ${out.tr.resQ}/100). `;
  else if(out.tr&&out.tr.why) s+=`فريم الساعة: ${out.tr.why}. `;
  if(x){ s+=`الهدف عند ${x.tpLbl} (${f(x.tp)}) ومسافة العائد/المخاطرة ${x.rr.toFixed(2)} مع وقف خلف خط الساعة على ${f(x.sl)} (Buffer ${out.bufferAtr.toFixed(2)}×ATR).`; }
  else if(out.missing&&out.missing.length) s+=`ما يفصل الإشارة: ${out.missing[0]}.`;
  return s;
}

async function analyzeCoin(sym,btc,liq){
  const [dR,h4R,h1R]=await Promise.all([Bybit.klines(sym,'D',180),Bybit.klines(sym,'240',180),Bybit.klines(sym,'60',200)]);
  const D=dR.slice(0,-1),H4=h4R.slice(0,-1),H1=h1R.slice(0,-1); // شموع مغلقة فقط للتحليل
  D.tfMs=86400e3;H4.tfMs=14400e3;H1.tfMs=3600e3;
  const price=MD.price(sym)||H1[H1.length-1].c;
  const inst=Bybit.inst[sym]||{},tick=inst.tick||Math.pow(10,-decimalsOf(sym));
  const ctx={sym,tick,price,D,H4,H1,swD:TA.swings(D,3),sw4:TA.swings(H4,3),sw1:TA.swings(H1,3),
    atrD:TA.atr(D),atr4:TA.atr(H4),atr1:TA.atr(H1),btc,liq,coinR:compRet(D,H4,H1)};
  ctx.supZ=TA.zones(ctx.swD.lows,ctx.atrD,D);
  ctx.resZ=TA.zones(ctx.swD.highs,ctx.atrD,D);
  const L=evalSide(ctx,'LONG'), S=evalSide(ctx,'SHORT');
  let best=null,setup=null;
  const done=[L,S].filter(x=>x.gates.all);
  if(done.length){done.sort((a,b)=>b.confidence-a.confidence);best=done[0];setup=best.dir;}
  const src=best||((L.missing.length<=S.missing.length)?L:S);
  const nearSup=ctx.supZ.filter(z=>z.high<price).pop()||ctx.supZ[0]||null;
  const nearRes=ctx.resZ.find(z=>z.low>price)||null;
  const rep={supZone:nearSup&&{low:nearSup.low,high:nearSup.high,touches:nearSup.touches},
    resZone:nearRes&&{low:nearRes.low,high:nearRes.high,touches:nearRes.touches},
    supLine:(src.tr&&src.tr.ok&&src.dir==='LONG')?{t1:src.tr.supLine.t1,p1:src.tr.supLine.p1,t2:src.tr.supLine.t2,p2:src.tr.supLine.p2,q:src.tr.supQ}:null,
    resLine:(src.tr&&src.tr.ok&&src.dir==='SHORT')?{t1:src.tr.resLine.t1,p1:src.tr.resLine.p1,t2:src.tr.resLine.t2,p2:src.tr.resLine.p2,q:src.tr.resQ}:null,
    brkLevel:src.brk?src.brk.level:null, atr1:ctx.atr1, dirBest:src.dir};
  return {symbol:sym,price,pct24:MD.pct(sym),
    tf:{d:trendLabel(ctx.swD),h4:trendLabel(ctx.sw4),h1:trendLabel(ctx.sw1)},
    setup,confidence:best?best.confidence:null,
    gates:best?best.gates:null,
    missing:best?[]:[...new Set([...L.missing,...S.missing])].slice(0,3),
    L:{gates:L.gates,missing:L.missing,conf:L.confidence},
    S:{gates:S.gates,missing:S.missing,conf:S.confidence},
    reason:src.reason,rep,
    turnover:(Bybit.tickers[sym]&&Bybit.tickers[sym].turnover)||0,
    _Le:L,_Se:S};
}

/* ============================================================
   08 — مدير الإشارات: دورة الحياة + تأكيد SL + الأحداث
============================================================ */
const Signals={
  byId(id){return Store.signals.find(s=>s.id===id)},
  ev(s,type,data){ s.events.push({t:Date.now(),type,data:data||{}}); },
  async replayAll(){
    for(const s of Store.openSignals()){ try{await this.sweep(s,true)}catch(e){console.warn('replay',e)} }
    Store.saveSig();
  },
  async sweep(s,initial){
    const bars=clamp(Math.ceil((Date.now()-s.createdAt)/3600e3)+6,6,200);
    const raw=await Bybit.klines(s.symbol,'60',bars);
    for(const c of raw.slice(0,-1)){ // مغلقة فقط
      if(c.t<=s.createdAt||c.t<=(s.lastH1||0)) continue;
      if(s.status!=='OPEN') break;
      this.onClosedCandle(s.symbol,'60',c,true);
    }
    if(s.status==='OPEN'){
      const dRaw=await Bybit.klines(s.symbol,'D',3); const d=dRaw.length>=2?dRaw[dRaw.length-2]:null;
      if(d&&d.t>(s.lastD||0)&&d.t>s.createdAt){ s.lastD=d.t;
        const lv=s.levels||{};
        if(s.direction==='LONG'&&lv.zoneLow!=null&&d.c<lv.zoneLow) this.invalidate(s,d.c,'إغلاق يومي تحت منطقة الدعم');
        if(s.direction==='SHORT'&&lv.zoneHigh!=null&&d.c>lv.zoneHigh) this.invalidate(s,d.c,'إغلاق يومي فوق منطقة المقاومة'); } }
    if(!initial) Store.saveSig();
  },
  onClosedCandle(sym,tf,c,silent){
    if(tf==='60'){ for(const s of Store.openSignals(sym)){
      if(c.t<=s.createdAt||c.t<=(s.lastH1||0)) continue;
      this.step(s,c);
    } if(!silent) Store.saveSig(); }
    else if(tf==='D'){ for(const s of Store.openSignals(sym)){
      if(c.t<=s.createdAt||c.t<=(s.lastD||0)) continue;
      s.lastD=c.t; const lv=s.levels||{};
      if(s.direction==='LONG'&&lv.zoneLow!=null&&c.c<lv.zoneLow) this.invalidate(s,c.c,'إغلاق يومي تحت منطقة الدعم');
      if(s.direction==='SHORT'&&lv.zoneHigh!=null&&c.c>lv.zoneHigh) this.invalidate(s,c.c,'إغلاق يومي فوق منطقة المقاومة'); }
      if(!silent) Store.saveSig(); }
  },
  /* مستوى خط SL عند الزمن t — من نقاط الارتكاز الحقيقية المخزنة */
  lineAt(s,t){ const L=s.slLine;
    if(L&&L.t2>L.t1){ const sl=(L.p2-L.p1)/(L.t2-L.t1); return L.p1+sl*(t-L.t1); }
    return s.sl; // احتياط: خط غير صالح → المستوى الثابت
  },
  step(s,c){
    s.lastH1=c.t;
    if(s.direction==='LONG'){
      s.mfe=Math.max(s.mfe||0,(c.h-s.entry)/s.entry*100);
      s.mae=Math.min(s.mae||0,(c.l-s.entry)/s.entry*100);
      if(c.h>=s.tp){ this.ev(s,'TP_TRIGGER',{high:c.h}); this.close(s,'TP_HIT',s.tp); return; }
      const lv=this.lineAt(s,c.t);
      if(c.c<lv){ s.slCount=(s.slCount||0)+1; this.ev(s,'SL_CONFIRMATION',{n:s.slCount,close:c.c,line:lv});
        if(s.slCount>=2){ this.close(s,'SL_HIT',c.c); return; } }
      else s.slCount=0;
    } else {
      s.mfe=Math.max(s.mfe||0,(s.entry-c.l)/s.entry*100);
      s.mae=Math.min(s.mae||0,(s.entry-c.h)/s.entry*100);
      if(c.l<=s.tp){ this.ev(s,'TP_TRIGGER',{low:c.l}); this.close(s,'TP_HIT',s.tp); return; }
      const lv=this.lineAt(s,c.t);
      if(c.c>lv){ s.slCount=(s.slCount||0)+1; this.ev(s,'SL_CONFIRMATION',{n:s.slCount,close:c.c,line:lv});
        if(s.slCount>=2){ this.close(s,'SL_HIT',c.c); return; } }
      else s.slCount=0;
    }
  },
  /* السعر الحي (WebSocket أو REST polling) — لتحديث MFE/MAE وللمس المباشر لـTP */
  onPriceTick(sym,p){
    const opens=Store.openSignals(sym); if(!opens.length)return;
    for(const s of opens){
      if(s.direction==='LONG'){
        s.mfe=Math.max(s.mfe||0,(p-s.entry)/s.entry*100);
        s.mae=Math.min(s.mae||0,(p-s.entry)/s.entry*100);
        if(p>=s.tp){ this.ev(s,'TP_TRIGGER',{live:p}); this.close(s,'TP_HIT',s.tp); }
      } else {
        s.mfe=Math.max(s.mfe||0,(s.entry-p)/s.entry*100);
        s.mae=Math.min(s.mae||0,(s.entry-p)/s.entry*100);
        if(p<=s.tp){ this.ev(s,'TP_TRIGGER',{live:p}); this.close(s,'TP_HIT',s.tp); }
      }
    }
  },
  close(s,status,exitPrice){
    s.status=status; s.closedAt=Date.now(); s.exitPrice=exitPrice; s.slCount=0;
    s.result=status==='TP_HIT'?'WIN':status==='SL_HIT'?'LOSS':status==='MANUALLY_CLOSED'?'MANUAL':'INVALID';
    s.durationMin=Math.round((s.closedAt-s.createdAt)/60000);
    this.ev(s,'CLOSED',{status,exitPrice}); Store.saveSig();
    const kind=status==='TP_HIT'?'tp':status==='SL_HIT'?'sl':'manual';
    Notify.fire(kind,`${s.symbol} — ${s.direction==='LONG'?'شراء':'بيع'}`,
      status==='TP_HIT'?`تحقق الهدف عند ${fmtP(s.symbol,exitPrice)} (ربح ${fmtPct(pnlPct(s,exitPrice))})`:
      status==='SL_HIT'?`تأكيد الوقف بإغلاقَين — خروج عند ${fmtP(s.symbol,exitPrice)} (${fmtPct(pnlPct(s,exitPrice))})`:
      `إغلاق يدوي عند ${fmtP(s.symbol,exitPrice)} (${fmtPct(pnlPct(s,exitPrice))})`);
    UI.refreshIf(['home','history']);
  },
  invalidate(s,exitPrice,why){ this.ev(s,'INVALIDATED',{why}); this.close(s,'INVALIDATED',exitPrice); },
  manualClose(s){
    const p=MD.price(s.symbol); if(!p){toast('لا يوجد سعر حي حالي','er');return;}
    this.ev(s,'MANUAL_CLOSE_REQUEST',{price:p}); this.close(s,'MANUALLY_CLOSED',p);
  },
  /* النشر: يتطلب اكتمال كل بوابات المحرك + النتيجة الفعلية للتقييم + عتبة الثقة */
  tryPublish(row){
    const ev=row.setup==='LONG'?row._Le:row._Se;
    if(!ev||!ev.gates.all||!ev.slLine) return false;
    if(Store.openBySymbol(row.symbol)) return false;   // حماية التكرار — العملة كاملة
    const entry=MD.price(row.symbol)||row.price; if(!entry) return false;
    const s={id:uid(),symbol:row.symbol,direction:ev.dir,status:'OPEN',
      entry,sl:ev.sl,tp:ev.tp,rr:+ev.rr.toFixed(2),confidence:ev.confidence,
      createdAt:Date.now(),closedAt:null,exitPrice:null,result:null,mfe:0,mae:0,slCount:0,
      reason:ev.reason,
      context:{daily:ev.gates.accept2?'قبول بإغلاقَين':'قبول بإغلاق',h4:ev.brk.struct?'BOS':'كسر مستوى',h1:'قناة '+ev.dir},
      levels:{zoneLow:ev.zone.low,zoneHigh:ev.zone.high},
      slLine:{t1:ev.slLine.t1,p1:ev.slLine.p1,t2:ev.slLine.t2,p2:ev.slLine.p2},
      events:[{t:Date.now(),type:'CREATED',data:{entry,sl:ev.sl,tp:ev.tp,conf:ev.confidence}}]};
    Store.signals.unshift(s); Store.saveSig();
    MD.watchSignal(s.symbol);
    Notify.fire('new',`إشارة جديدة: ${s.symbol} ${s.direction}`,
      `Entry ${fmtP(s.symbol,entry)} · SL ${fmtP(s.symbol,s.sl)} · TP ${fmtP(s.symbol,s.tp)} · الثقة ${s.confidence}/100`);
    UI.refreshIf(['home']);
    return true;
  }
};

async function pool(items,n,fn){ let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{
    while(i<items.length){ const k=i++; try{await fn(items[k],k)}catch(e){console.warn(e)} } })); }
const Scanner={
  running:false,
  async run(){
    if(this.running)return; this.running=true;
    try{
      await Bybit.refreshTickers();
      const coins=Store.settings.coins.filter(c=>c.enabled&&Bybit.inst[c.symbol]);
      // تعطيل تلقائي للرموز غير المتاحة في المصدر
      for(const c of Store.settings.coins){ if(c.enabled&&!Bybit.inst[c.symbol]&&Bybit.healthy){
        c.enabled=false;c.reason='غير متاح حاليًا في Bybit Linear'; } }
      Store.saveSet();
      const btc=await this.btcContext();
      const turns=coins.map(c=>(Bybit.tickers[c.symbol]||{}).turnover||0).sort((a,b)=>a-b);
      const liqOf=t=>{ if(!t)return 3; let below=0; for(const x of turns)if(x<t)below++; return 1+Math.round(4*below/Math.max(1,turns.length-1)); };
      const thr=Store.settings.threshold;
      const rows=[]; let done=0,published=0;
      const syms=coins.map(c=>c.symbol);
      UI.scanUI(true,0,syms.length);
      await pool(syms,4,async sym=>{
        try{
          const r=await analyzeCoin(sym,btc,liqOf((Bybit.tickers[sym]||{}).turnover));
          rows.push(r);
          if(r.gates&&r.gates.all&&r.confidence!=null&&r.confidence>=thr&&!btc.highVol){
            if(Signals.tryPublish(r)) published++;
          }
        }catch(e){
          console.warn('[scan]',sym,e.message);
          if(Bybit.healthy&&/invalid symbol/i.test(e.message)){
            const c=Store.coin(sym); if(c){c.enabled=false;c.reason='رمز غير متاح في Bybit Linear';Store.saveSet();}
          }
          rows.push({symbol:sym,error:true,reason:'تعذر جلب البيانات — سيُعاد في الفحص التالي'});
        }
        done++; UI.scanUI(true,done,syms.length);
      });
      rows.sort((a,b)=>(b.confidence??-1)-(a.confidence??-1));
      const slim=rows.map(r=>{ const o={}; for(const k in r){ if(k.charAt(0)!=='_') o[k]=r[k]; } return o; });
      Store.scan={time:Date.now(),btc,rows:slim}; Store.saveScan();
      UI.scanUI(false);
      toast(`اكتمل الفحص: ${rows.length} عملة${published?` — نُشرت ${published} إشارة`:' — لا نماذج مكتملة'}`);
    } finally { this.running=false; }
  },
  async btcContext(){
    const [dR,h4R,h1R]=await Promise.all([Bybit.klines('BTCUSDT','D',120),Bybit.klines('BTCUSDT','240',120),Bybit.klines('BTCUSDT','60',120)]);
    const D=dR.slice(0,-1),H4=h4R.slice(0,-1),H1=h1R.slice(0,-1);
    D.tfMs=86400e3;H4.tfMs=14400e3;H1.tfMs=3600e3;
    const sd=TA.swings(D,3),s4=TA.swings(H4,3);
    const dir=sw=>{const h=sw.highs,l=sw.lows; if(h.length<2||l.length<2)return 0;
      return (h[h.length-1].p>h[h.length-2].p&&l[l.length-1].p>l[l.length-2].p)?1:
             (h[h.length-1].p<h[h.length-2].p&&l[l.length-1].p<l[l.length-2].p)?-1:0;};
    const sc=dir(sd)+dir(s4);
    const pct24=MD.pct('BTCUSDT');
    return {price:MD.price('BTCUSDT')||H1[H1.length-1].c,pct24,
      regime:sc>=1?'BULLISH':sc<=-1?'BEARISH':'NEUTRAL',highVol:Math.abs(pct24)>=8,
      coinR:compRet(D,H4,H1)};
  }
};

const ChartCtl={
  chart:null,series:null,lines:[],sym:null,tf:'60',_tls:[],
  async load(sym,tf,silent){
    this.sym=sym;this.tf=tf;
    const wrap=$('#chartWrap'); if(!wrap)return;
    if(typeof LightweightCharts==='undefined'){
      wrap.innerHTML='<div style="display:grid;place-items:center;height:100%;color:var(--dim);font-size:12px">تعذر تحميل مكتبة الشارت — تحقق من الاتصال ثم اضغط تحديث</div>';
      return; }
    if(!this.chart){
      wrap.innerHTML='<div id="chart"></div>';
      this.chart=LightweightCharts.createChart($('#chart'),{layout:{background:{type:'solid',color:'transparent'},textColor:'#5B6885',fontSize:10,fontFamily:'JetBrains Mono'},
        grid:{vertLines:{color:'#131C30'},horzLines:{color:'#131C30'}},
        rightPriceScale:{borderColor:'#1A2338'},timeScale:{borderColor:'#1A2338',timeVisible:true,secondsVisible:false},
        crosshair:{mode:0},height:300,width:wrap.clientWidth});
      this.series=this.chart.addCandlestickSeries({upColor:'#2BD98B',downColor:'#FF5D75',borderUpColor:'#2BD98B',borderDownColor:'#FF5D75',wickUpColor:'#2BD98B',wickDownColor:'#FF5D75'});
      new ResizeObserver(()=>{ if(this.chart) this.chart.applyOptions({width:wrap.clientWidth}); }).observe(wrap);
    }
    this.clearLines();
    let raw; try{raw=await Bybit.klines(sym,tf,200)}catch(e){ if(!silent)toast('تعذر جلب بيانات الشارت','er'); return; }
    this.series.setData(raw.map(c=>({time:Math.floor(c.t/1000),open:c.o,high:c.h,low:c.l,close:c.c})));
    this.chart.timeScale().fitContent();
    this.drawOverlays();
  },
  clearLines(){ for(const l of this.lines){try{this.series.removePriceLine(l)}catch(e){}} this.lines=[];
    for(const s of this._tls){try{this.chart.removeSeries(s)}catch(e){}} this._tls=[]; },
  pl(price,color,title,style){ if(price==null||!isFinite(price))return;
    this.lines.push(this.series.createPriceLine({price,color,lineWidth:1,lineStyle:style??2,title,axisLabelVisible:true})); },
  tl(L,color,tfMs,extendBars){ if(!L||!L.t2||L.t2<=L.t1)return;
    const end=Date.now()+extendBars*tfMs; const sl=(L.p2-L.p1)/(L.t2-L.t1);
    const s=this.chart.addLineSeries({color,lineWidth:1,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
    s.setData([{time:Math.floor(L.t1/1000),value:L.p1},{time:Math.floor(end/1000),value:L.p1+sl*(end-L.t1)}]);
    this._tls.push(s); },
  drawOverlays(){
    const sym=this.sym,tfMs={'60':3600e3,'240':14400e3,'D':86400e3}[this.tf]||3600e3;
    const row=(Store.scan&&Store.scan.rows||[]).find(r=>r.symbol===sym);
    const sig=Store.openBySymbol(sym);
    if(row&&row.rep){
      if(row.rep.supZone){this.pl(row.rep.supZone.low,'#2BD98B','D support',3);this.pl(row.rep.supZone.high,'#2BD98B','D support',3);}
      if(row.rep.resZone){this.pl(row.rep.resZone.low,'#FF5D75','D resist',3);this.pl(row.rep.resZone.high,'#FF5D75','D resist',3);}
      if(this.tf==='60'){
        if(row.rep.supLine&&row.rep.dirBest==='LONG')this.tl(row.rep.supLine,'#8B7CFF',tfMs,8);
        if(row.rep.resLine&&row.rep.dirBest==='SHORT')this.tl(row.rep.resLine,'#8B7CFF',tfMs,8);
        if(row.rep.brkLevel)this.pl(row.rep.brkLevel,'#F0B35C','4H break',1); }
    }
    if(sig){ this.pl(sig.entry,'#8B7CFF','Entry',0); this.pl(sig.sl,'#FF5D75','SL',0); this.pl(sig.tp,'#2BD98B','TP',0);
      if(this.tf==='60'&&sig.slLine)this.tl(sig.slLine,'#FF5D75',tfMs,6); }
    const lg=$('#dLegend');
    if(lg) lg.innerHTML=`<span><i style="background:#2BD98B"></i>دعم/هدف</span><span><i style="background:#FF5D75"></i>مقاومة/وقف</span><span><i style="background:#8B7CFF"></i>خطوط وEntry</span><span><i style="background:#F0B35C"></i>كسر 4H</span>`;
  },
  onKlineTick(sym,tf,c){ if(sym!==this.sym||tf!==this.tf||!this.series)return;
    try{this.series.update({time:Math.floor(c.t/1000),open:c.o,high:c.h,low:c.l,close:c.c})}catch(e){} }
};

    try{ await Telegram.send('اختبار من مِرصاد — الإعداد يعمل بشكل صحيح.'); toast('وصلت رسالة الاختبار إلى تيليجرام'); }
    catch(e){ toast('فشل الاختبار: '+e.message,'er'); } },
  askPerm(){ if(!('Notification'in window)){toast('المتصفح لا يدعم الإشعارات','er');return;}
    Notification.requestPermission().then(p=>{toast(p==='granted'?'تم تفعيل إشعارات المتصفح':'لم يُمنح الإذن',p==='granted'?'ok':'er');}); },
  coinAdd(){ const inp=$('#newCoin'); const sym=(inp.value||'').trim().toUpperCase();
    if(!/^[A-Z0-9]{4,20}$/.test(sym)){toast('رمز غير صالح','er');return;}
    if(!Bybit.inst[sym]){toast('الرمز غير موجود في Bybit Linear','er');return;}
    if(Store.coin(sym)){toast('الرمز موجود مسبقًا','er');return;}
    Store.settings.coins.push({symbol:sym,enabled:true,reason:null}); Store.saveSet();
    MD.sub(['tickers.'+sym]); this.renderSettings(); toast('أُضيف '+sym); },
  coinAct(act,sym){ const arr=Store.settings.coins; const i=arr.findIndex(c=>c.symbol===sym); if(i<0)return;
    if(act==='coin-del'){arr.splice(i,1);MD.unsub(['tickers.'+sym]);}
    if(act==='coin-up'&&i>0){const t=arr[i-1];arr[i-1]=arr[i];arr[i]=t;}
    if(act==='coin-dn'&&i<arr.length-1){const t=arr[i+1];arr[i+1]=arr[i];arr[i]=t;}
    Store.saveSet(); this.renderSettings(); },
  clearHist(){ modal(`<h3>مسح سجل الصفقات</h3><p class="muted" style="font-size:12.5px">سيُحذف كل السجل والإحصائيات نهائيًا من هذا الجهاز. الإشارات المفتوحة لن تُمس.</p>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn blk" onclick="document.querySelector('#modal').classList.remove('on')">إلغاء</button>
    <button class="btn dng blk" id="doClear">تأكيد المسح</button></div>`);
    $('#doClear').onclick=()=>{ Store.signals=Store.signals.filter(s=>s.status==='OPEN'); Store.saveSig();
      closeModal(); toast('تم مسح السجل'); if(this.cur==='history')this.renderHistory(); }; },
  rcalc(){ const e=+$('#rc-e').value,sl=+$('#rc-sl').value,tp=+$('#rc-tp').value,lev=+$('#rc-lev').value||1;
    const cap=Store.settings.capital,rp=Store.settings.riskPct;
    if(!(e>0&&sl>0&&e!==sl)){$('#rcOut').textContent='أدخل Entry و SL صحيحين ومختلفين.';return;}
    const riskAmt=cap*rp/100, perUnit=Math.abs(e-sl), units=riskAmt/perUnit, notional=units*e, margin=notional/lev;
    const dir=e>sl?'LONG':'SHORT'; const sgn=dir==='LONG'?1:-1;
    const profit=(tp>0?units*sgn*(tp-e):null);
    const liq=e*(1-sgn/lev);
    $('#rcOut').innerHTML=`الاتجاه حسب المستويات: <b>${dir}</b><br>
      مبلغ المخاطرة: <b class="num">$${riskAmt.toFixed(2)}</b> · حجم المركز: <b class="num">${units.toFixed(4)} وحدة</b><br>
      القيمة الاسمية: <b class="num">$${notional.toFixed(0)}</b> · الهامش التقديري: <b class="num">$${margin.toFixed(0)}</b><br>
      خسارة محتملة عند SL: <b class="num" style="color:var(--dn)">-$${riskAmt.toFixed(2)}</b>
      ${profit!=null?` · ربح محتمل عند TP: <b class="num" style="color:var(--up)">+$${Math.max(0,profit).toFixed(2)}</b>`:''}<br>
      تصفية تقديرية (عزل، تقريبية): <b class="num">${liq.toFixed(4)}</b>`; },
  /* ---------- تفاصيل العملة ---------- */
  async openDetail(sym){
    $('#detail').classList.add('on'); $('#dSym').textContent=sym;
    $('#dBody').innerHTML=`<div class="tabs" id="dT">${['60','240','D'].map(tf=>`<button class="tab ${tf==='60'?'on':''}" data-act="dtf" data-tf="${tf}">${{60:'1H','240':'4H',D:'1D'}[tf]}</button>`).join('')}</div>
      <div id="chartWrap" dir="ltr"><div id="chart"></div></div>
      <div class="legend" id="dLegend"></div>
      <div id="dRep" class="muted" style="text-align:center;padding:20px">جارٍ التحليل بالبيانات الحقيقية…</div>`;
    const dPx=$('#dPx'),dPct=$('#dPct');
    dPx.setAttribute('data-live','price:'+sym); dPx.textContent=MD.price(sym)?fmtP(sym,MD.price(sym)):'—';
    dPct.setAttribute('data-live','pct:'+sym);
    Live.bind();
    const cached=(Store.scan&&Store.scan.rows||[]).find(r=>r.symbol===sym);
    if(cached)this.paintDetail(cached);
    MD.sub(['kline.60.'+sym,'kline.240.'+sym,'kline.D.'+sym]);
    await ChartCtl.load(sym,'60');
    if(this._autoIv)clearInterval(this._autoIv);
    this._autoIv=setInterval(()=>{ // في وضع REST نحدّث الشارت دوريًا بدل دفعة الشموع الحية
      if(MD.mode!=='live'&&$('#detail').classList.contains('on')&&ChartCtl.sym)
        ChartCtl.load(ChartCtl.sym,ChartCtl.tf,true); },60000);
    try{ const btc=(Store.scan&&Store.scan.btc)||await Scanner.btcContext();
      const fresh=await analyzeCoin(sym,btc,3);
      const rows=(Store.scan&&Store.scan.rows)||null;
      if(rows){const i=rows.findIndex(r=>r.symbol===sym); if(i>=0)rows[i]=fresh;}
      this.paintDetail(fresh);
    }catch(e){ if(!cached)$('#dRep').innerHTML='<div class="empty">تعذر جلب البيانات — تحقق من الاتصال وأعد المحاولة.</div>'; }
  },
  dTabs(tf){ $$('#dT .tab').forEach(b=>b.classList.toggle('on',b.dataset.tf===tf)); },
  closeDetail(){ $('#detail').classList.remove('on');
    if(this._autoIv){clearInterval(this._autoIv);this._autoIv=null;}
    const sym=ChartCtl.sym;
    if(ChartCtl.chart){ChartCtl.chart.remove();ChartCtl.chart=null;ChartCtl.series=null;ChartCtl.lines=[];ChartCtl._tls=[];}
    if(sym)MD.unwatchKlines(sym); },
  paintDetail(r){ if(!r||!$('#dBody').innerHTML)return;
    $('#dSub').textContent=`Perpetual · ${this.tfAr(r.tf.d)} على اليومي`;
    const gl=(r.L&&r.L.gates)||{}, gs2=(r.S&&r.S.gates)||{};
    const rep=r.rep||{};
    const gate=(l,v,extra)=>`<div class="gate"><span>${l}</span><span class="${v?'ok':'no'}">${v?'✓ '+(extra||''):'✗'}</span></div>`;
    const lv=(t,a,b,x)=>`<div class="lvl"><span>${t}</span><span class="num">${a!=null?fmtP(r.symbol,a)+' – '+fmtP(r.symbol,b):'—'}</span><span class="tiny">${x||''}</span></div>`;
    const qb=(q)=>q!=null?`<div class="qbar"><i style="width:${q}%"></i></div>`:'';
    $('#dRep').innerHTML=`
      <div class="sec-t"><h2>قراءة المحرك</h2><span class="sub">${r.setup?r.setup+' مكتمل الشروط'+(r.confidence!=null?` · ${r.confidence}/100`:''):'لا إشارة مكتملة'}</span></div>
      <div class="card"><p class="muted" style="font-size:12.5px;line-height:1.9">${esc(r.reason)}</p>
      ${r.missing&&r.missing.length?`<div class="hr"></div><div class="tiny">ما يفصل الإشارة:</div>`+
        r.missing.map(m=>`<div class="gate"><span style="font-size:11.5px">${esc(m)}</span><span class="no">✗</span></div>`).join(''):''}</div>
      <div class="sec-t"><h2>شروط المحرك — LONG</h2></div>
      <div class="card">${gate('دعم يومي حقيقي + لمسات',gl.daily,'منطقة')}${gate('قبول يومي بإغلاق 1–2 شمعة',gl.daily&&gl.accept2)}${gate('كسر/BOS صاعد على 4H بالإغلاق',gl.h4)}${gate('اتجاه 1H صاعد (HH+HL)',gl.h1)}${gate('قناة صاعدة بجودة 70+',gl.lines)}${gate('R:R ≥ 2.0',gl.rr)}</div>
      <div class="sec-t"><h2>شروط المحرك — SHORT</h2></div>
      <div class="card">${gate('مقاومة يومية حقيقية',gs2.daily,'منطقة')}${gate('رفض يومي بإغلاق 1–2 شمعة',gs2.daily&&gs2.accept2)}${gate('كسر/BOS هابط على 4H بالإغلاق',gs2.h4)}${gate('اتجاه 1H هابط (LH+LL)',gs2.h1)}${gate('قناة هابطة بجودة 70+',gs2.lines)}${gate('R:R ≥ 2.0',gs2.rr)}</div>
      <div class="sec-t"><h2>المستويات المكتشفة</h2></div>
      <div class="card">
        ${lv('دعم يومي',rep.supZone&&rep.supZone.low,rep.supZone&&rep.supZone.high,(rep.supZone&&rep.supZone.touches||'')+' لمسات')}
        ${lv('مقاومة يومية',rep.resZone&&rep.resZone.low,rep.resZone&&rep.resZone.high,(rep.resZone&&rep.resZone.touches||'')+' لمسات')}
        <div class="lvl"><span>خط دعم 1H</span><span>${rep.supLine&&rep.dirBest==='LONG'?'جودة '+rep.supLine.q:'/100':'—'}</span>${rep.supLine&&rep.dirBest==='LONG'?qb(rep.supLine.q):''}</div>
        <div class="lvl"><span>خط مقاومة 1H</span><span>${rep.resLine&&rep.dirBest==='SHORT'?'جودة '+rep.resLine.q+'/100':'—'}</span>${rep.resLine&&rep.dirBest==='SHORT'?qb(rep.resLine.q):''}</div>
        <div class="lvl"><span>مستوى كسر 4H</span><span class="num">${rep.brkLevel?fmtP(r.symbol,rep.brkLevel):'—'}</span></div>
        <div class="lvl"><span>ATR (1H)</span><span class="num">${rep.atr1?rep.atr1.toPrecision(4):'—'}</span></div>
        <div class="lvl"><span>سيولة 24س</span><span class="num">${r.turnover?fmtC(r.turnover):'—'}</span></div>
      </div>`;
  },
  /* ---------- مشاركة / إغلاق يدوي ---------- */
  share(s){ if(!s)return; const f=fmtP;
    const txt=`${s.symbol} — ${s.direction}\n${'—'.repeat(18)}\nEntry: ${f(s.symbol,s.entry)}\nSL: ${f(s.symbol,s.sl)}\nTP: ${f(s.symbol,s.tp)}\nR:R: ${s.rr}\nConfidence: ${s.confidence}/100\n${s.reason}\n${'—'.repeat(18)}\nمِرصاد — تحليل هيكلي 1D/4H/1H`;
    if(navigator.share)navigator.share({title:`${s.symbol} ${s.direction}`,text:txt}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('نُسخت الإشارة إلى الحافظة')).catch(()=>toast('تعذر النسخ','er'));
    else toast('المشاركة غير مدعومة في هذه البيئة','er'); },
  confirmManual(s){ if(!s||s.status!=='OPEN')return;
    const p=MD.price(s.symbol)||s.entry, raw=pnlPct(s,p);
    modal(`<h3>إغلاق يدوي — <span class="num">${s.symbol}</span></h3>
      <div class="statg" style="grid-template-columns:repeat(3,1fr)">
        <div class="stat"><b>${fmtP(s.symbol,p)}</b><span>السعر الحالي</span></div>
        <div class="stat"><b>${fmtP(s.symbol,s.entry)}</b><span>Entry</span></div>
        <div class="stat"><b style="color:${raw>=0?'var(--up)':'var(--dn)'}">${fmtPct(raw)}</b><span>P/L الحالي</span></div></div>
      <p class="muted" style="font-size:12px;margin-top:12px">سيُسجَّل الإغلاق عند السعر الحالي بحالة "إغلاق يدوي" ولا تُعدَّل نتيجته التاريخية لاحقًا.</p>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn blk" onclick="document.querySelector('#modal').classList.remove('on')">تراجع</button>
        <button class="btn dng blk" id="doMC">تأكيد الإغلاق</button></div>`);
    $('#doMC').onclick=()=>{closeModal();Signals.manualClose(s);toast('أُغلقت الإشارة يدويًا');}; },
  tickCountdown(){ const el=$('#cdTxt'); if(!el)return;
    const ms=3600e3-(Date.now()%3600e3)+90e3; const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
    el.textContent=`الفحص التالي عند إغلاق شمعة الساعة — بعد ${m}:${String(s).padStart(2,'0')}`; }
};

/* ============================================================
   13 — إقلاع التطبيق
   REST أولًا → فتح Dashboard فورًا → WebSocket في الخلفية (لا يحجب أبدًا)
============================================================ */
function bootLog(t,ok){ const d=document.createElement('div');
  d.textContent=(ok?'[OK] ':'[--] ')+t;
  if(ok)d.className='done'; else if(ok===false)d.className='warn';
  const bl=$('#bootLog'); if(bl)bl.appendChild(d);
  console.log('[boot]',t); }
function hideSplash(){ const sp=$('#splash'); if(!sp)return;
  sp.style.opacity='0'; sp.style.transition='.35s'; setTimeout(()=>{if(sp.parentNode)sp.remove()},380); }
async function boot(){
  bootLog('config + storage init',true);
  bootLog('connecting Bybit REST (v5)');
  let restOK=false;
  try{ await Bybit.loadInstruments();
    bootLog('instruments '+Object.keys(Bybit.inst).length+' · tick sizes dynamic',true); restOK=true; }
  catch(e){ bootLog('instruments failed: '+e.message,false); }
  try{ await Bybit.refreshTickers();
    bootLog('tickers cached — real prices',true); restOK=true; }
  catch(e){ bootLog('tickers failed: '+e.message,false); }
  UI.init(); UI.conn(); UI.freeze();
  bootLog('opening dashboard — '+(restOK?'REST mode':'OFFLINE (auto-retry)'),true);
  UI.go('home');
  setTimeout(hideSplash,450);
  MD.init(); // polling فوري + محاولة WebSocket بمهلة 8 ثوانٍ — لا تحجب التطبيق أبدًا
  bootLog('websocket attempt (timeout 8s)');
  bootLog('restoring signal lifecycle');
  try{ await Signals.replayAll(); }catch(e){ bootLog('replay warn: '+e.message,false); }
  const opens=Store.openSignals();
  opens.forEach(s=>MD.watchSignal(s.symbol));
  bootLog('open signals: '+opens.length,true);
  bootLog('strategy engine 1D→4H→1H ready',true);
  if(!restOK) toast('لا يمكن الوصول إلى Bybit حاليًا — ستُعاد المحاولة تلقائيًا','er');
  Scanner.run(); // فحص غير حاجب
}

/* فحص تلقائي عند إغلاق كل شمعة ساعة */
let lastHour=Math.floor(Date.now()/3600e3);
setInterval(()=>{ const h=Math.floor(Date.now()/3600e3);
  if(h!==lastHour){ lastHour=h;
    if(document.visibilityState==='visible'&&!Scanner.running) Scanner.run(); } },20000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){Bybit.refreshTickers().catch(()=>{});} });

/* PWA: manifest مُولَّد محليًا */
try{
  const iconSVG=`<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"><rect width="512" height="512" rx="110" fill="#0C1322"/><g fill="none" stroke="#8B7CFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"><path d="M90 340 L215 215 L285 285 L425 140"/><path d="M315 140 H425 V250"/></g></svg>`;
  const manifest={name:'مِرصاد — إشارات الفيوتشرز',short_name:'مِرصاد',dir:'rtl',lang:'ar',
    start_url:'.',display:'standalone',background_color:'#080C14',theme_color:'#080C14',
    icons:[{src:'data:image/svg+xml;utf8,'+encodeURIComponent(iconSVG),sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
  const l=document.createElement('link'); l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/json'}));
  document.head.appendChild(l);
  if(location.protocol==='https:'&&navigator.serviceWorker&&navigator.serviceWorker.register)
    navigator.serviceWorker.register('sw.js').catch(()=>{});
}catch(e){}

Store.load();
boot();

})();
