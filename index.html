/* ============================================================
   INDICATORS
============================================================ */

function calculateEMA(values,period) {

if(values.length < period) return null;

const multiplier=2/(period+1);

let ema=values.slice(0,period)
.reduce((a,b)=>a+b,0)/period;

for(let i=period;i<values.length;i++) {

ema=(values[i]-ema)*multiplier+ema;

}

return ema;

}


function calculateATR(highs,lows,closes,period=14) {

if(highs.length<period+1) return 0;

const trs=[];

for(let i=1;i<highs.length;i++) {

const tr=Math.max(

highs[i]-lows[i],

Math.abs(highs[i]-closes[i-1]),

Math.abs(lows[i]-closes[i-1])

);

trs.push(tr);

}

return trs.slice(-period)
.reduce((a,b)=>a+b,0)/period;

}


function calculateADX(highs,lows,closes,period=14) {

if(highs.length<period*2+1) return 0;

const trs=[];
const plusDM=[];
const minusDM=[];

for(let i=1;i<highs.length;i++) {

const upMove=highs[i]-highs[i-1];
const downMove=lows[i-1]-lows[i];

const tr=Math.max(
highs[i]-lows[i],
Math.abs(highs[i]-closes[i-1]),
Math.abs(lows[i]-closes[i-1])

);

trs.push(tr);

plusDM.push(
upMove>downMove && upMove>0 ? upMove : 0
);

minusDM.push(
downMove>upMove && downMove>0 ? downMove : 0
);

}

const recentTR=trs.slice(-period);
const recentPlus=plusDM.slice(-period);
const recentMinus=minusDM.slice(-period);

const atr=recentTR.reduce((a,b)=>a+b,0)/period;

if(atr===0) return 0;

const plusDI=
100*(recentPlus.reduce((a,b)=>a+b,0)/period)/atr;

const minusDI=
100*(recentMinus.reduce((a,b)=>a+b,0)/period)/atr;

const denominator=plusDI+minusDI;

if(denominator===0) return 0;

return 100*Math.abs(plusDI-minusDI)/denominator;

}


function averageVolume(volumes,period=20) {

if(volumes.length<period) return 0;

return volumes.slice(-period)
.reduce((a,b)=>a+b,0)/period;

}


/* ============================================================
   MARKET STRUCTURE
============================================================ */

function detectStructure(highs,lows,closes) {

if(closes.length<10) {

return {
bos:null,
choch:null,
liquiditySweep:null
};

}

const last=closes.length-1;

const recentHigh=Math.max(...highs.slice(-8,-1));

const recentLow=Math.min(...lows.slice(-8,-1));

let bos=null;

if(closes[last]>recentHigh) bos='BULLISH';

if(closes[last]<recentLow) bos='BEARISH';

const previousHigh=Math.max(...highs.slice(-14,-7));

const previousLow=Math.min(...lows.slice(-14,-7));

let choch=null;

if(
closes[last]>previousHigh &&
closes[last-1]<previousHigh
) {

choch='BULLISH';

}

if(
closes[last]<previousLow &&
closes[last-1]>previousLow
) {

choch='BEARISH';

}

let liquiditySweep=null;

const lastLow=lows[last];

const lastHigh=highs[last];

if(
lastLow<recentLow &&
closes[last]>recentLow
) {

liquiditySweep='BULLISH';

}

if(
lastHigh>recentHigh &&
closes[last]<recentHigh
) {

liquiditySweep='BEARISH';

}

return {
bos,
choch,
liquiditySweep
};

}


/* ============================================================
   TRADE ID
============================================================ */

function createTradeId(symbol) {

const timestamp=Date.now();

let randomPart='';

try {

if(
window.crypto &&
typeof window.crypto.randomUUID==='function'
) {

randomPart=
window.crypto.randomUUID()
.replace(/-/g,'')
.slice(0,12);

}

}
catch(error) {

console.warn(
'Crypto UUID unavailable:',
error
);

}

if(!randomPart) {

randomPart=
Math.random()
.toString(36)
.slice(2,14);

}

return `trade_${symbol.toLowerCase()}_${timestamp}_${randomPart}`;

}


/* ============================================================
   FIXED TRADE LEVELS
   IMPORTANT:
   Entry / SL / TP1 / TP2 / TP3 are locked permanently.
   They are NEVER recalculated after the trade is created.
============================================================ */

function normalizeTradeSignal(signal) {

if(!signal)
return signal;

const entryValue=
Number(
signal.entryPriceFixed ??
signal.entryPrice
);

const slValue=
Number(
signal.slFixed ??
signal.sl
);

const tp1Value=
Number(
signal.tp1Fixed ??
signal.tp1
);

const tp2Value=
Number(
signal.tp2Fixed ??
signal.tp2
);

const tp3Value=
Number(
signal.tp3Fixed ??
signal.tp3
);

return {

...signal,

tradeId:
signal.tradeId ||
signal.id ||
createTradeId(
signal.symbol ||
'UNKNOWN'
),

entryPrice:
entryValue,

sl:
slValue,

tp1:
tp1Value,

tp2:
tp2Value,

tp3:
tp3Value,

/*
IMPORTANT:
These are the permanent levels of this trade.
They are created once and never changed.
*/

entryPriceFixed:
entryValue,

slFixed:
slValue,

tp1Fixed:
tp1Value,

tp2Fixed:
tp2Value,

tp3Fixed:
tp3Value,

levelsLocked:true,

tp1Hit:
Boolean(signal.tp1Hit),

tp2Hit:
Boolean(signal.tp2Hit),

lastCheckedPrice:
signal.lastCheckedPrice ??
null,

lastCheckedAt:
signal.lastCheckedAt ??
null,

exitPrice:
signal.exitPrice ??
null,

pnlPct:
signal.pnlPct ??
null

};

}


/* ============================================================
   PROFIT / LOSS CALCULATION
============================================================ */

function calculateTradePnlPct(signal,exitPrice) {

const entry=
Number(
signal.entryPriceFixed ??
signal.entryPrice
);

const exit=
Number(exitPrice);

if(
!Number.isFinite(entry) ||
!Number.isFinite(exit) ||
entry<=0
) {

return 0;

}

if(signal.action==='BUY') {

return (
((exit-entry)/entry)*100
);

}

return (
((entry-exit)/entry)*100
);

}


/* ============================================================
   SIGNAL ENGINE
============================================================ */

async function analyzePair(pairObj) {

const pair=pairObj.symbol;

try {

const [
res15,
res1h,
res4h
]=await Promise.all([

fetch(
`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=15m&limit=120`
),

fetch(
`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=1h&limit=120`
),

fetch(
`https://fapi.binance.com/fapi/v1/klines?symbol=${pair}&interval=4h&limit=120`
)

]);

if(!res15.ok || !res1h.ok || !res4h.ok)
return null;


const candles15=await res15.json();

const candles1h=await res1h.json();

const candles4h=await res4h.json();


if(
candles15.length<60 ||
candles1h.length<60 ||
candles4h.length<60
)
return null;


const closes15=candles15.map(k=>parseFloat(k[4]));
const highs15=candles15.map(k=>parseFloat(k[2]));
const lows15=candles15.map(k=>parseFloat(k[3]));
const volumes15=candles15.map(k=>parseFloat(k[5]));


const closes1h=candles1h.map(k=>parseFloat(k[4]));

const closes4h=candles4h.map(k=>parseFloat(k[4]));

const highs4h=candles4h.map(k=>parseFloat(k[2]));

const lows4h=candles4h.map(k=>parseFloat(k[3]));


const currentPrice=closes15[closes15.length-1];


/* 4H BIAS */

const ema20_4h=calculateEMA(closes4h,20);

const ema50_4h=calculateEMA(closes4h,50);

const htfBias=
ema20_4h>=ema50_4h
?'BULLISH'
:'BEARISH';


/* 1H CONFIRMATION */

const ema20_1h=calculateEMA(closes1h,20);

const ema50_1h=calculateEMA(closes1h,50);

const oneHourBias=
ema20_1h>=ema50_1h
?'BULLISH'
:'BEARISH';


/* 15M */

const ema20_15=calculateEMA(closes15,20);

const ema50_15=calculateEMA(closes15,50);

const localBias=
ema20_15>=ema50_15
?'BULLISH'
:'BEARISH';


/* ADX */

const adx=calculateADX(
highs15,
lows15,
closes15,
14
);


/* ATR */

const atr=calculateATR(
highs15,
lows15,
closes15,
14
);

if(!atr || atr<=0)
return null;


/* VOLUME */

const avgVol=averageVolume(volumes15,20);

const currentVolume=volumes15[volumes15.length-1];

const volumeStrong=
currentVolume>=avgVol*1.05;


/* MOMENTUM */

const momentumPct=
(
(currentPrice-closes15[closes15.length-4])/
closes15[closes15.length-4]
)*100;


/* STRUCTURE */

const structure=
detectStructure(
highs15,
lows15,
closes15
);


/* SCORE */

let buyScore=0;

let sellScore=0;

const buyReasons=[];

const sellReasons=[];


/* 4H */

if(htfBias==='BULLISH') {

buyScore+=25;

buyReasons.push('اتجاه 4H صاعد');

}

else {

sellScore+=25;

sellReasons.push('اتجاه 4H هابط');

}


/* 1H */

if(oneHourBias==='BULLISH') {

buyScore+=15;

buyReasons.push('تأكيد 1H صاعد');

}

else {

sellScore+=15;

sellReasons.push('تأكيد 1H هابط');

}


/* 15M */

if(localBias==='BULLISH') {

buyScore+=10;

buyReasons.push('اتجاه 15M صاعد');

}

else {

sellScore+=10;

sellReasons.push('اتجاه 15M هابط');

}


/* ADX */

if(adx>20) {

if(buyScore>=sellScore) {

buyScore+=15;

buyReasons.push(`ADX قوي ${adx.toFixed(1)}`);

}

else {

sellScore+=15;

sellReasons.push(`ADX قوي ${adx.toFixed(1)}`);

}

}


/* VOLUME */

if(volumeStrong) {

if(buyScore>=sellScore) {

buyScore+=10;

buyReasons.push('حجم تداول مرتفع');

}

else {

sellScore+=10;

sellReasons.push('حجم تداول مرتفع');

}

}


/* MOMENTUM */

if(momentumPct>0.10) {

buyScore+=10;

buyReasons.push('Momentum صاعد');

}

if(momentumPct<-0.10) {

sellScore+=10;

sellReasons.push('Momentum هابط');

}


/* BOS */

if(structure.bos==='BULLISH') {

buyScore+=10;

buyReasons.push('BOS صاعد');

}

if(structure.bos==='BEARISH') {

sellScore+=10;

sellReasons.push('BOS هابط');

}


/* CHOCH */

if(structure.choch==='BULLISH') {

buyScore+=5;

buyReasons.push('CHoCH صاعد');

}

if(structure.choch==='BEARISH') {

sellScore+=5;

sellReasons.push('CHoCH هابط');

}


/* LIQUIDITY */

if(structure.liquiditySweep==='BULLISH') {

buyScore+=5;

buyReasons.push('Liquidity Sweep صاعد');

}

if(structure.liquiditySweep==='BEARISH') {

sellScore+=5;

sellReasons.push('Liquidity Sweep هابط');

}


let action;

let score;

let reasons;


if(buyScore>=sellScore) {

action='BUY';

score=buyScore;

reasons=buyReasons;

}

else {

action='SELL';

score=sellScore;

reasons=sellReasons;

}


/* MINIMUM SCORE */

if(score<65)
return null;


/* ADX MUST BE ABOVE 20 */

if(adx<=20)
return null;


/* 4H DIRECTION ENFORCEMENT */

if(action==='BUY' && htfBias!=='BULLISH')
return null;

if(action==='SELL' && htfBias!=='BEARISH')
return null;


/* ============================================================
   ENTRY
   THIS VALUE IS CAPTURED ONCE FOR THIS TRADE
============================================================ */

const entry=currentPrice;


/* ============================================================
   ATR TARGETS
   THESE VALUES ARE CALCULATED ONLY ONCE.
   AFTER RETURNING THE SIGNAL THEY ARE LOCKED.
============================================================ */

const slDistance=atr*1.6;

const tp1Distance=atr*2.0;

const tp2Distance=atr*3.4;

const tp3Distance=atr*5.0;


const sl=
action==='BUY'
?entry-slDistance
:entry+slDistance;


const tp1=
action==='BUY'
?entry+tp1Distance
:entry-tp1Distance;


const tp2=
action==='BUY'
?entry+tp2Distance
:entry-tp2Distance;


const tp3=
action==='BUY'
?entry+tp3Distance
:entry-tp3Distance;


/* CONFIDENCE */

const confidenceScore=Math.min(
95,
Math.max(
65,
Math.round(score)
)
);


/* ============================================================
   CREATE NEW TRADE
============================================================ */

const tradeId=
createTradeId(pair);


const newSignal={

id:tradeId,

tradeId:tradeId,

symbol:pair,

pair:pair,

action:action,

type:action,

direction:action,

status:'ACTIVE',


/*
PERMANENT TRADE LEVELS
*/

entryPrice:entry,

sl:sl,

tp1:tp1,

tp2:tp2,

tp3:tp3,

entryPriceFixed:entry,

slFixed:sl,

tp1Fixed:tp1,

tp2Fixed:tp2,

tp3Fixed:tp3,

levelsLocked:true,


/*
TARGET STATE
*/

tp1Hit:false,

tp2Hit:false,

lastCheckedPrice:entry,

lastCheckedAt:new Date().toISOString(),

exitPrice:null,

pnlPct:null,


timeframe:'15m',

confirmationTimeframe:'1h',

higherTimeframe:'4h',

htfBias:htfBias,

oneHourBias:oneHourBias,

adx:adx,

atr:atr,

confidenceScore:confidenceScore,

precision:pairObj.precision,

smcConfluences:reasons,

timestamp:new Date().toISOString(),

createdAt:new Date().toLocaleTimeString(
'ar-SA',
{
hour:'2-digit',
minute:'2-digit'
}
)

};


/*
FINAL NORMALIZATION.
This guarantees that the levels are stored as
fixed values from the moment of creation.
*/

return normalizeTradeSignal(newSignal);

}

catch(error) {

console.error(`Error analyzing ${pair}:`,error);

return null;

}

}

if(!Number.isFinite(livePrice))

high24h:parseFloat(item.highPrice),

low24h:parseFloat(item.lowPrice),

volume24h:parseFloat(item.quoteVolume)

}

});

setLastRefreshed(

);

catch(error) {

/* ============================================================
   SIGNAL ENGINE
============================================================ */

const analyzeAndGenerateSignals=useCallback(
async()=>{

setIsAnalyzing(true);

try {

const generated=[];

for(const pairObj of PAIRS) {

const signal=
await analyzePair(pairObj);

if(signal)
generated.push(
normalizeTradeSignal(signal)
);

}


/* ============================================================
   DO NOT DUPLICATE ACTIVE COIN
============================================================ */

if(generated.length>0) {

setActiveSignals(prev=>{

const current=
prev.map(
signal=>normalizeTradeSignal(signal)
);

generated.forEach(newSignal=>{

const existing=
current.find(
s=>
s.symbol===newSignal.symbol &&
s.status==='ACTIVE'
);

if(!existing) {

current.unshift(
normalizeTradeSignal(newSignal)
);

}

});


return current.slice(0,30);

});

}

}
catch(error) {

console.error(
'Signal generation error:',
error
);

finally {

setIsLoading(false);

[]);


/* ============================================================
   CHECK ACTIVE TRADES
   FIXED TRADE LIFECYCLE
============================================================ */

const monitorActiveSignals=useCallback(()=>{

/*
Do not allow overlapping monitoring cycles.
*/

if(monitorBusyRef.current)
return;

monitorBusyRef.current=true;

try {

if(
!Array.isArray(activeSignals) ||
activeSignals.length===0
) {

return;

}


const tradesToClose=[];

const tradesToUpdate=[];

const closedIds=new Set();


/* ============================================================
   PROCESS EACH ACTIVE TRADE
============================================================ */

activeSignals.forEach(rawSignal=>{

const signal=
normalizeTradeSignal(rawSignal);


/*
Only ACTIVE trades can be monitored.
A CLOSED trade can never be reopened.
*/

if(signal.status!=='ACTIVE')
return;


/*
Each trade is identified by tradeId.
*/

const tradeId=
signal.tradeId ||
signal.id;


/*
If this trade is already being closed,
do not process it again.
*/

if(
processingTradesRef.current.has(tradeId)
) {

return;

}


/*
Get live Binance price.
*/

const ticker=
marketTickers[signal.symbol];

if(!ticker)
return;


const price=
Number(ticker.price);

if(!Number.isFinite(price))
return;


/*
IMPORTANT:
Read ONLY the fixed levels.
Never calculate new levels here.
*/

const entry=
Number(
signal.entryPriceFixed
);

const sl=
Number(
signal.slFixed
);

const tp1=
Number(
signal.tp1Fixed
);

const tp2=
Number(
signal.tp2Fixed
);

const tp3=
Number(
signal.tp3Fixed
);


if(
!Number.isFinite(entry) ||
!Number.isFinite(sl) ||
!Number.isFinite(tp1) ||
!Number.isFinite(tp2) ||
!Number.isFinite(tp3)
) {

console.error(
'Invalid fixed trade levels:',
signal
);

return;

}


let updatedSignal={
...signal,

/*
The live price changes.
The trade levels NEVER change.
*/

lastCheckedPrice:price,

lastCheckedAt:new Date().toISOString(),

entryPriceFixed:entry,

slFixed:sl,

tp1Fixed:tp1,

tp2Fixed:tp2,

tp3Fixed:tp3,

entryPrice:entry,

sl:sl,

tp1:tp1,

tp2:tp2,

tp3:tp3,

levelsLocked:true

};


let closeReason=null;


/* ============================================================
   BUY TRADE
============================================================ */

if(signal.action==='BUY') {


/*
STOP LOSS HAS PRIORITY.

If the current price is at or below the
fixed SL, the trade is CLOSED immediately.
*/

if(price<=sl) {

closeReason='Stop Loss';

}


/*
If SL was not hit, check TP levels.
*/

else {


/*
TP1:
Record it, but DO NOT move TP2 or TP3.
*/

if(
price>=tp1 &&
!signal.tp1Hit
) {

updatedSignal.tp1Hit=true;

updatedSignal.tp1HitAt=
new Date().toISOString();

}


/*
TP2:
Record it, but DO NOT move TP3.
*/

if(
price>=tp2 &&
!signal.tp2Hit
) {

updatedSignal.tp2Hit=true;

updatedSignal.tp2HitAt=
new Date().toISOString();

}


/*
TP3 IS THE FINAL TARGET.

Once price reaches the fixed TP3,
the trade is CLOSED permanently.
*/

if(price>=tp3) {

closeReason='TP3';

}

}

}


/* ============================================================
   SELL TRADE
============================================================ */

else if(signal.action==='SELL') {


/*
STOP LOSS HAS PRIORITY.

For SELL, SL is above entry.
*/

if(price>=sl) {

closeReason='Stop Loss';

}


/*
If SL was not hit, check targets.
*/

else {


/*
TP1:
Record it without moving any level.
*/

if(
price<=tp1 &&
!signal.tp1Hit
) {

updatedSignal.tp1Hit=true;

updatedSignal.tp1HitAt=
new Date().toISOString();

}


/*
TP2:
Record it without moving TP3.
*/

if(
price<=tp2 &&
!signal.tp2Hit
) {

updatedSignal.tp2Hit=true;

updatedSignal.tp2HitAt=
new Date().toISOString();

}


/*
TP3 IS THE FINAL TARGET.

Once price reaches fixed TP3,
the trade is CLOSED permanently.
*/

if(price<=tp3) {

closeReason='TP3';

}

}

}


/* ============================================================
   CLOSE TRADE
============================================================ */

if(closeReason) {


/*
Mark the trade as processing BEFORE
changing React state.

This prevents duplicate closure records.
*/

processingTradesRef.current.add(
tradeId
);

closedIds.add(tradeId);


/*
Calculate final P/L using the ORIGINAL
fixed entry and the ACTUAL exit price.
*/

const pnlPct=
calculateTradePnlPct(
updatedSignal,
price
);


const closedTrade={

...updatedSignal,

status:'CLOSED',

closeReason:closeReason,

exitPrice:price,

pnlPct:pnlPct,

closedAt:new Date().toLocaleTimeString(
'ar-SA',
{
hour:'2-digit',
minute:'2-digit',
second:'2-digit'
}
),

closedAtISO:
new Date().toISOString(),

/*
Permanent levels remain unchanged even
after closure.
*/

entryPriceFixed:entry,

slFixed:sl,

tp1Fixed:tp1,

tp2Fixed:tp2,

tp3Fixed:tp3,

entryPrice:entry,

sl:sl,

tp1:tp1,

tp2:tp2,

tp3:tp3,

levelsLocked:true

};


tradesToClose.push(
closedTrade
);

}


/* ============================================================
   ONLY UPDATE TARGET HIT STATE
   WITHOUT MOVING LEVELS
============================================================ */

else if(
updatedSignal.tp1Hit!==signal.tp1Hit ||
updatedSignal.tp2Hit!==signal.tp2Hit
) {

tradesToUpdate.push(
updatedSignal
);

}

});


/* ============================================================
   APPLY TP1 / TP2 UPDATES
============================================================ */

if(tradesToUpdate.length>0) {

const updateMap=
new Map(
tradesToUpdate.map(
trade=>[
trade.tradeId ||
trade.id,
trade
]
)
);


setActiveSignals(prev=>{

return prev.map(rawSignal=>{

const tradeId=
rawSignal.tradeId ||
rawSignal.id;

const updated=
updateMap.get(tradeId);

if(!updated)
return rawSignal;


/*
Keep all fixed values exactly as they were.
*/

return normalizeTradeSignal({

...rawSignal,

...updated,

entryPrice:
rawSignal.entryPriceFixed ??
rawSignal.entryPrice,

sl:
rawSignal.slFixed ??
rawSignal.sl,

tp1:
rawSignal.tp1Fixed ??
rawSignal.tp1,

tp2:
rawSignal.tp2Fixed ??
rawSignal.tp2,

tp3:
rawSignal.tp3Fixed ??
rawSignal.tp3,

entryPriceFixed:
rawSignal.entryPriceFixed ??
rawSignal.entryPrice,

slFixed:
rawSignal.slFixed ??
rawSignal.sl,

tp1Fixed:
rawSignal.tp1Fixed ??
rawSignal.tp1,

tp2Fixed:
rawSignal.tp2Fixed ??
rawSignal.tp2,

tp3Fixed:
rawSignal.tp3Fixed ??
rawSignal.tp3,

levelsLocked:true

});

});

}

}


/* ============================================================
   MOVE CLOSED TRADES TO HISTORY
============================================================ */

if(tradesToClose.length>0) {


/*
Remove closed trades from ACTIVE immediately.
*/

setActiveSignals(prev=>{

return prev.filter(signal=>{

const tradeId=
signal.tradeId ||
signal.id;

return !closedIds.has(
tradeId
);

});

});


/*
Add closed trades to history exactly once.
*/

setClosedSignals(prev=>{

const existingIds=
new Set(
prev.map(
signal=>
signal.tradeId ||
signal.id
)
);


const newClosedTrades=
tradesToClose.filter(
trade=>
!existingIds.has(
trade.tradeId ||
trade.id
)
);


if(newClosedTrades.length===0)
return prev;


return [
...newClosedTrades,
...prev
].slice(0,100);

});


/*
Allow processing lock to be removed after
the state transition has been scheduled.
*/

setTimeout(()=>{

tradesToClose.forEach(trade=>{

processingTradesRef.current.delete(
trade.tradeId ||
trade.id
);

});

},100);

}

}
catch(error) {

console.error(
'Trade monitoring error:',
error
);

}
finally {

monitorBusyRef.current=false;

}

},[
activeSignals,
marketTickers
]);

   START ENGINE
============================================================ */

/* ============================================================
   PWA INSTALLATION
============================================================ */

(function(){

let deferredInstallPrompt=null;


function isStandalone(){

return (

window.matchMedia(
'(display-mode: standalone)'
).matches ||

window.navigator.standalone===true

);

}


function updateInstallButton(){

const button=
document.getElementById(
'installAppButton'
);

if(!button)
return;


if(isStandalone()) {

button.classList.remove('visible');

return;

}


if(deferredInstallPrompt) {

button.classList.add('visible');

}

}


window.__installQuantSignalsApp=
async function(){

if(!deferredInstallPrompt){

alert(
'افتح التطبيق باستخدام Chrome عبر HTTPS حتى يصبح التثبيت متاحًا.'
);

return;

}


deferredInstallPrompt.prompt();

const choice=
await deferredInstallPrompt.userChoice;

deferredInstallPrompt=null;

updateInstallButton();

console.log(
'PWA installation:',
choice.outcome
);

};


window.addEventListener(
'beforeinstallprompt',
event=>{

event.preventDefault();

deferredInstallPrompt=event;

updateInstallButton();

}
);


window.addEventListener(
'appinstalled',
()=>{

deferredInstallPrompt=null;

updateInstallButton();

}
);


window.addEventListener(
'load',
()=>{

updateInstallButton();


if('serviceWorker' in navigator){

navigator.serviceWorker
.register(
'./service-worker.js',
{
scope:'./'
}
)
.then(
registration=>{

console.log(
'Service Worker registered:',
registration.scope
);

}
)
.catch(
error=>{

console.error(
'Service Worker error:',
error
);

}

);

}

}

);

})();


ReactDOM
.createRoot(
document.getElementById('root')
)
.render(<App/>);

</script>
