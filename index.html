<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>BOSWaves Scanner</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22BOSWaves%20Scanner%22,%22short_name%22:%22Scanner%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0e14%22,%22theme_color%22:%22%230a0e14%22}">
<style>
:root{
--bg:#0a0e14;
--panel:#10151d;
--panel2:#151b25;
--line:#1f2733;
--txt:#e7ecf3;
--dim:#7c8798;
--bull:#00ff88;
--bear:#ff3355;
--accent:#3fd0ff;
--amber:#ffb84d;
--mono:'JetBrains Mono','Courier New',monospace;
--disp:'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:var(--disp);height:100%;overflow-x:hidden;}
body{padding-bottom:12px;}
.mono{font-family:var(--mono);}
#loadingScreen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#loadingScreen .spinner{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 0.9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loadingScreen .msg{font-size:13px;color:var(--dim);font-family:var(--mono);}
.topbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#0d1219,#0a0e14 90%);border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-name{font-weight:700;font-size:15px;}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.header-actions{display:flex;gap:8px;}
.view{display:none;padding:12px;}
.view.active{display:block;}
.scanbar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;gap:8px;}
.scanbar-left{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bull);}
.dot.scanning{background:var(--amber);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.scan-meta{font-size:10.5px;color:var(--dim);font-family:var(--mono);}
.btn-scan{background:var(--panel2);border:1px solid var(--line);color:var(--accent);border-radius:8px;padding:6px 12px;font-size:11.5px;font-family:var(--mono);}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:10px;}
.chart-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;}
.chart-sym{font-weight:700;font-size:13px;font-family:var(--mono);}
.chart-tf{font-size:11px;color:var(--dim);font-family:var(--mono);}
canvas#chartCanvas{width:100%;height:150px;display:block;border-radius:8px;}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.filter-tabs{display:flex;gap:6px;}
.ftab{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 11px;font-size:12px;display:flex;align-items:center;gap:5px;}
.ftab.active{color:var(--txt);border-color:var(--accent);}
.ftab .cnt{font-size:10px;font-weight:800;background:var(--panel);border-radius:8px;padding:1px 6px;}
.ftab.buy.active{color:var(--bull);border-color:var(--bull);}
.ftab.sell.active{color:var(--bear);border-color:var(--bear);}
select.sortsel{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;font-family:var(--mono);}
.sig-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;position:relative;}
.sig-card.buy{border-left:4px solid var(--bull);}
.sig-card.sell{border-left:4px solid var(--bear);}
.sig-top{display:flex;justify-content:space-between;align-items:flex-start;}
.sig-badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;}
.sig-badge.buy{background:rgba(0,255,136,.14);color:var(--bull);}
.sig-badge.sell{background:rgba(255,51,85,.14);color:var(--bear);}
.sig-sym{font-weight:700;font-size:14.5px;margin-top:5px;font-family:var(--mono);}
.sig-tf{font-size:11px;color:var(--dim);font-family:var(--mono);}
.sig-score{text-align:left;}
.score-num{font-size:19px;font-weight:800;font-family:var(--mono);}
.score-lbl{font-size:9.5px;color:var(--dim);}
.result-badge{font-size:10px;padding:2px 7px;border-radius:5px;font-family:var(--mono);margin-top:4px;display:inline-block;}
.result-win{background:rgba(0,255,136,.14);color:var(--bull);}
.result-loss{background:rgba(255,51,85,.14);color:var(--bear);}
.result-expired{background:rgba(124,135,152,.14);color:var(--dim);}
.sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
.sg-item{background:var(--panel2);border-radius:8px;padding:7px 8px;text-align:center;}
.sg-label{font-size:9.5px;color:var(--dim);margin-bottom:2px;}
.sg-val{font-size:12.5px;font-weight:700;font-family:var(--mono);}
.empty{text-align:center;color:var(--dim);padding:40px 16px;}
.empty .ic{font-size:36px;display:block;margin-bottom:10px;opacity:.5;}
.empty h3{font-size:14.5px;color:var(--txt);margin:0 0 6px;}
.empty p{font-size:12.5px;margin:0 0 14px;}
.criteria-list{text-align:right;font-size:11.5px;color:var(--dim);max-width:280px;margin:0 auto;}
.criteria-item{display:flex;gap:7px;align-items:flex-start;padding:4px 0;}
.criteria-item .dot2{color:var(--accent);margin-top:2px;}
.scan-note{font-size:10.5px;color:var(--dim);opacity:.7;margin-top:10px;}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:none;}
.sheet-overlay.open{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-radius:16px 16px 0 0;z-index:81;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .2s ease;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--line);}
.sheet.open{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.sheet-close{position:absolute;left:14px;top:14px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;width:30px;height:30px;}
.reason-box{background:var(--panel2);border-radius:10px;padding:11px;font-size:12px;color:var(--dim);line-height:1.7;margin-top:10px;}
.history-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hi-left{display:flex;flex-direction:column;gap:2px;}
.hi-sym{font-weight:700;font-size:13px;font-family:var(--mono);}
.hi-time{font-size:10.5px;color:var(--dim);font-family:var(--mono);}
.settings-group{margin-bottom:14px;}
.settings-group h4{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin:0 0 8px;}
.field{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px;}
.field label{font-size:13px;flex:1;}
.field input[type=number],.field input[type=text],.field input[type=password]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;width:110px;font-family:var(--mono);font-size:13px;text-align:center;}
.field select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:12px;}
.switch{position:relative;width:42px;height:24px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;flex-shrink:0;}
.switch.on{background:var(--accent);border-color:var(--accent);}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;}
.switch.on .knob{transform:translateX(18px);}
.btn{display:block;width:100%;background:var(--accent);color:#031018;border:none;border-radius:10px;padding:11px;font-weight:700;font-size:13px;margin-top:6px;}
.btn.secondary{background:var(--panel2);color:var(--txt);border:1px solid var(--line);}
.btn.danger{background:rgba(255,51,85,.15);color:var(--bear);border:1px solid rgba(255,51,85,.3);}
.symbol-chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.symbol-chip{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:11.5px;font-family:var(--mono);}
.symbol-chip.on{color:var(--accent);border-color:var(--accent);}
.install-fab{position:fixed;bottom:16px;left:16px;background:var(--accent);color:#031018;border:none;border-radius:24px;padding:11px 16px;font-weight:700;font-size:12.5px;z-index:60;display:none;box-shadow:0 4px 14px rgba(0,0,0,.4);}
.install-fab.show{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>

<script>
function rmaSeries(values, len){
const out = new Array(values.length).fill(null);
if(values.length < len) return out;
let sum = 0;
for(let i=0;i<len;i++) sum += values[i];
let prev = sum/len;
out[len-1] = prev;
for(let i=len;i<values.length;i++){
prev = (prev*(len-1) + values[i]) / len;
out[i] = prev;
}
return out;
}

function computeATRSeries(candles, len){
const tr = candles.map((c,i)=>{
if(i===0) return c.high - c.low;
const prevClose = candles[i-1].close;
return Math.max(c.high-c.low, Math.abs(c.high-prevClose), Math.abs(c.low-prevClose));
});
return rmaSeries(tr, len);
}

function computeADXSeries(candles, len){
const n = candles.length;
const plusDM = new Array(n).fill(0);
const minusDM = new Array(n).fill(0);
const tr = new Array(n).fill(0);
for(let i=1;i<n;i++){
const upMove = candles[i].high - candles[i-1].high;
const downMove = candles[i-1].low - candles[i].low;
plusDM[i] = (upMove > downMove && upMove > 0) ? upMove : 0;
minusDM[i] = (downMove > upMove && downMove > 0) ? downMove : 0;
const prevClose = candles[i-1].close;
tr[i] = Math.max(candles[i].high-candles[i].low, Math.abs(candles[i].high-prevClose), Math.abs(candles[i].low-prevClose));
}
const smPlusDM = rmaSeries(plusDM, len);
const smMinusDM = rmaSeries(minusDM, len);
const smTR = rmaSeries(tr, len);
const diPlus = new Array(n).fill(null);
const diMinus = new Array(n).fill(null);
const dx = new Array(n).fill(null);
for(let i=0;i<n;i++){
if(smTR[i] !== null && smTR[i] !== 0 && smPlusDM[i] !== null && smMinusDM[i] !== null){
diPlus[i] = 100 * smPlusDM[i] / smTR[i];
diMinus[i] = 100 * smMinusDM[i] / smTR[i];
const sum = diPlus[i] + diMinus[i];
dx[i] = sum > 0 ? 100 * Math.abs(diPlus[i]-diMinus[i]) / sum : 0;
}
}
const dxClean = dx.map(v=> v===null ? 0 : v);
const adxRaw = rmaSeries(dxClean.slice(dx.findIndex(v=>v!==null) < 0 ? 0 : 0), len);
const firstDX = dx.findIndex(v=>v!==null);
const adx = new Array(n).fill(null);
if(firstDX >= 0){
const sub = dx.slice(firstDX).map(v=>v===null?0:v);
const smAdx = rmaSeries(sub, len);
for(let i=0;i<sub.length;i++){
adx[firstDX+i] = smAdx[i];
}
}
return {adx, diPlus, diMinus};
}

/* ---------------- BOSWaves engine ---------------- */

function clampf(v, lo, hi){ return Math.max(lo, Math.min(v, hi)); }
function clampf2(v, lo, hi, fallback){ if(isNaN(v)) return fallback; return Math.max(lo, Math.min(v, hi)); }

class BOSWavesEngine{
constructor(symbol, tfKey, cfg){
this.symbol = symbol;
this.tfKey = tfKey;
this.cfg = cfg;
this.candles = [];
this.atr = [];
this.adx = [];
this.obs = [];
this.nextObId = 1;
this.processedPivotUpTo = -1;
this.lastConfirmedIdx = -1;
this.lastSwingHigh = null;
this.lastSwingLow = null;
this.structureBias = null;
this.signals = [];
this.lastPrice = null;
}

setCandles(candles){
this.candles = candles;
this.recomputeIndicators();
}

appendOrUpdateCandle(nc){
const idx = this.candles.findIndex(c=>c.time===nc.time);
if(idx>=0){ this.candles[idx] = nc; return; }
if(this.candles.length===0 || nc.time > this.candles[this.candles.length-1].time){
this.candles.push(nc);
}
}

trimHistory(maxLen){
if(this.candles.length <= maxLen) return;
const drop = this.candles.length - maxLen;
this.candles.splice(0, drop);
this.processedPivotUpTo = Math.max(-1, this.processedPivotUpTo - drop);
this.lastConfirmedIdx = Math.max(-1, this.lastConfirmedIdx - drop);
this.obs.forEach(ob=>{ ob.createdIdx -= drop; ob.pivotIdx -= drop; });
}

recomputeIndicators(){
this.atr = computeATRSeries(this.candles, this.cfg.atrLen);
const r = computeADXSeries(this.candles, this.cfg.adxLen);
this.adx = r.adx;
}

zonesOverlap(topA,botA,topB,botB){ return botA <= topB && topA >= botB; }

findObById(id){ return this.obs.find(o=>o.id===id) || null; }

unlockZone(id){
const ob = this.findObById(id);
if(ob) ob.signaledSide = null;
}

createOB(isBull, pivotIdx, confirmIdx){
const cfg = this.cfg;
const c = this.candles;
const oldestIdx = pivotIdx;
const newestIdx = Math.min(pivotIdx + cfg.baseCandles - 1, confirmIdx);
let rawTop, rawBot;
if(isBull){
rawTop = Math.max(c[oldestIdx].open, c[oldestIdx].close);
rawBot = c[oldestIdx].low;
for(let i=oldestIdx;i<=newestIdx;i++){
rawTop = Math.max(rawTop, Math.max(c[i].open, c[i].close));
rawBot = Math.min(rawBot, c[i].low);
}
} else {
rawTop = c[oldestIdx].high;
rawBot = Math.min(c[oldestIdx].open, c[oldestIdx].close);
for(let i=oldestIdx;i<=newestIdx;i++){
rawTop = Math.max(rawTop, c[i].high);
rawBot = Math.min(rawBot, Math.min(c[i].open, c[i].close));
}
}
const pivotATR = Math.max(this.atr[pivotIdx] || 0, 0.00000001);
const zoneH = rawTop - rawBot;
const minH = pivotATR * cfg.minZoneATR;
const maxH = pivotATR * cfg.maxZoneATR;
if(zoneH < minH){
const m = (rawTop+rawBot)/2;
rawTop = m + minH/2;
rawBot = m - minH/2;
}
if(rawTop - rawBot > maxH){
const m = (rawTop+rawBot)/2;
rawTop = m + maxH/2;
rawBot = m - maxH/2;
}
return {
id:this.nextObId++,
isBull, top:rawTop, bottom:rawBot, mid:(rawTop+rawBot)/2,
createdIdx:confirmIdx, pivotIdx,
touches:0, armed:false, active:false, wasInside:false,
broken:false, signaledSide:null
};
}

detectNewPivots(){
const cfg = this.cfg;
const c = this.candles;
const len = cfg.pivotLen;
const n = c.length;
const start = Math.max(this.processedPivotUpTo+1, len);
for(let i=start; i<=n-1-len; i++){
let isHigh = true, isLow = true;
for(let k=i-len;k<=i+len;k++){
if(k===i) continue;
if(c[k].high >= c[i].high) isHigh = false;
if(c[k].low <= c[i].low) isLow = false;
}
const confirmIdx = i + len;
if(isLow){
this.lastSwingLow = c[i].low;
const atrAtPivot = this.atr[i];
if(atrAtPivot && (c[confirmIdx].close - c[i].low) >= atrAtPivot*cfg.impulseATR){
this.registerOB(this.createOB(true, i, confirmIdx));
}
}
if(isHigh){
this.lastSwingHigh = c[i].high;
const atrAtPivot = this.atr[i];
if(atrAtPivot && (c[i].high - c[confirmIdx].close) >= atrAtPivot*cfg.impulseATR){
this.registerOB(this.createOB(false, i, confirmIdx));
}
}
this.processedPivotUpTo = i;
}
}

updateStructure(idx){
const bar = this.candles[idx];
let bosNow = null;
if(this.lastSwingHigh !== null && bar.close > this.lastSwingHigh){
bosNow = this.structureBias === "bear" ? "choch" : "bos";
this.structureBias = "bull";
}
if(this.lastSwingLow !== null && bar.close < this.lastSwingLow){
bosNow = this.structureBias === "bull" ? "choch" : "bos";
this.structureBias = "bear";
}
return bosNow;
}

registerOB(ob){
const cfg = this.cfg;
if(cfg.removeOverlap){
for(let idx=this.obs.length-1; idx>=0; idx--){
const old = this.obs[idx];
if(old.isBull === ob.isBull && this.zonesOverlap(ob.top,ob.bottom,old.top,old.bottom)){
this.obs.splice(idx,1);
break;
}
}
}
if(this.obs.length >= cfg.maxBlocks){
this.obs.shift();
}
this.obs.push(ob);
}

processConfirmedCandle(idx){
const c = this.candles;
const cfg = this.cfg;
const bar = c[idx];
const prevBar = idx>0 ? c[idx-1] : null;
const bosNow = this.updateStructure(idx);
const fired = [];
for(let i=this.obs.length-1;i>=0;i--){
const ob = this.obs[i];
if(ob.createdIdx > idx) continue;
if(ob.broken) continue;
const inside = bar.high >= ob.bottom && bar.low <= ob.top;
if(inside && !ob.wasInside){
ob.touches += 1;
ob.armed = true;
}
let longConfirm = false, shortConfirm = false;
if(inside && ob.isBull){
longConfirm = bar.close > ob.mid && (!prevBar || prevBar.close <= ob.mid || bar.low <= ob.mid);
}
if(inside && !ob.isBull){
shortConfirm = bar.close < ob.mid && (!prevBar || prevBar.close >= ob.mid || bar.high >= ob.mid);
}
let justFired = null;
if(ob.armed){
if(longConfirm){ ob.active = true; ob.armed = false; justFired = "long"; }
if(shortConfirm){ ob.active = true; ob.armed = false; justFired = "short"; }
}
ob.wasInside = inside;
const broken = cfg.invalidation === "Close"
? (ob.isBull ? bar.close < ob.bottom : bar.close > ob.top)
: (ob.isBull ? bar.low < ob.bottom : bar.high > ob.top);
if(broken){
ob.broken = true;
this.obs.splice(i,1);
continue;
}
if(justFired && ob.signaledSide !== justFired){
fired.push({side:justFired, ob, barIdx:idx, bosNow, structureBias:this.structureBias});
}
}
return fired;
}

evaluateSignal(raw, idx){
const cfg = this.cfg;
const bar = this.candles[idx];
const atrVal = this.atr[idx];
const adxVal = this.adx[idx];
const adxPass = adxVal !== null && adxVal !== undefined && adxVal > cfg.adxThresh;
const structureAligned = (raw.side==="long" && raw.structureBias==="bull") || (raw.side==="short" && raw.structureBias==="bear") || !!raw.bosNow;
const trendStrength = adxVal !== null && adxVal !== undefined && adxVal >= (cfg.adxThresh + 10);
const barRange = bar.high - bar.low;
const volatilityOk = !(atrVal && barRange > atrVal*2.5);
const parts = {
boswaves:SCORE_WEIGHTS.boswaves,
adx: adxPass ? SCORE_WEIGHTS.adx : 0,
structure: structureAligned ? SCORE_WEIGHTS.structure : 0,
trend: trendStrength ? SCORE_WEIGHTS.trend : 0,
volatility: volatilityOk ? SCORE_WEIGHTS.volatility : 0
};
const score = parts.boswaves+parts.adx+parts.structure+parts.trend+parts.volatility;
const passed = adxPass && score >= (cfg.minScore||0);
let signalType = raw.bosNow==="choch" ? "CHoCH" : (raw.bosNow==="bos" ? "BOS" : "Order Block Retest");
const reasonParts = [];
reasonParts.push(LANG==="ar" ? "منطقة BOSWaves + إعادة اختبار" : "BOSWaves zone + retest");
if(adxPass) reasonParts.push("ADX>"+cfg.adxThresh);
if(structureAligned) reasonParts.push(signalType);
if(trendStrength) reasonParts.push(LANG==="ar"?"اتجاه قوي":"strong trend");
if(volatilityOk) reasonParts.push(LANG==="ar"?"تذبذب طبيعي":"normal volatility");
return {
passed, score, parts, adx:adxVal, signalType,
reason: reasonParts.join(" + ")
};
}

onNewClosedCandle(){
this.detectNewPivots();
const idx = this.candles.length - 1;
if(idx <= this.lastConfirmedIdx) return [];
const allFired = [];
for(let i=this.lastConfirmedIdx+1;i<=idx;i++){
const fired = this.processConfirmedCandle(i);
fired.forEach(f=>{
const evalRes = this.evaluateSignal(f, i);
if(evalRes.passed){
f.ob.signaledSide = f.side;
allFired.push({
side:f.side, ob:f.ob, barIdx:i,
adx:evalRes.adx, score:evalRes.score, scoreParts:evalRes.parts,
signalType:evalRes.signalType, reason:evalRes.reason,
price:this.candles[i].close, time:this.candles[i].closeTime
});
}
});
}
this.lastConfirmedIdx = idx;
return allFired;
}

currentADX(){
if(this.adx.length===0) return null;
return this.adx[this.adx.length-1];
}
}

/* ---------------- Bybit data layer ---------------- */

const BYBIT_REST = "https://api.bybit.com/v5/market/kline";

async function fetchKlines(symbol, tfKey, limit){
const url = BYBIT_REST+"?category=linear&symbol="+symbol+"&interval="+tfKey+"&limit="+(limit||300);
const res = await fetch(url);
const json = await res.json();
if(!json.result || !json.result.list) return [];
const list = json.result.list.slice().reverse();
return list.map(row=>({
time: parseInt(row[0]),
open: parseFloat(row[1]),
high: parseFloat(row[2]),
low: parseFloat(row[3]),
close: parseFloat(row[4]),
volume: parseFloat(row[5]),
closeTime: parseInt(row[0])
}));
}

function engineKey(symbol, tfKey){ return symbol+"_"+tfKey; }

async function ensureEngine(symbol, tfKey){
const key = engineKey(symbol, tfKey);
if(engines[key]) return engines[key];
const eng = new BOSWavesEngine(symbol, tfKey, settings);
engines[key] = eng;
const candles = await fetchKlines(symbol, tfKey, 400);
if(candles.length>0){
eng.setCandles(candles);
eng.lastConfirmedIdx = -1;
eng.onNewClosedCandle();
}
return eng;
}

async function runScanCycle(manual){
if(scanning) return;
scanning = true;
updateScanStatus(true);
const tfKey = settings.timeframe;
let scannedCount = 0;
let filteredCount = 0;
const newSignals = [];
for(const symbol of settings.enabledSymbols){
try{
const eng = await ensureEngine(symbol, tfKey);
const fresh = await fetchKlines(symbol, tfKey, 5);
if(fresh.length>0){
fresh.forEach(nc=> eng.appendOrUpdateCandle(nc));
eng.trimHistory(600);
eng.recomputeIndicators();
const fired = eng.onNewClosedCandle();
fired.forEach(sig=>{
const trade = createSignalRecord(symbol, tfKey, sig);
newSignals.push(trade);
});
}
checkPendingResults(symbol, tfKey, eng);
scannedCount++;
if(eng.currentADX()===null || eng.currentADX()<=settings.adxThresh) filteredCount++;
}catch(e){
filteredCount++;
}
}
totalScanned = scannedCount;
filteredOut = filteredCount;
lastFullScan = Date.now();
scanning = false;
updateScanStatus(false);
newSignals.forEach(trade=>{
notifyNewSignal(trade);
telegramNewSignal(trade);
});
renderSignalList();
renderChart();
renderHistoryList();
hideLoadingScreen();
}


function createSignalRecord(symbol, tfKey, sig){
const cfg = settings;
const isBuy = sig.side === "long";
const entry = sig.price;
const slPrice = isBuy ? sig.ob.bottom : sig.ob.top;
const riskDist = Math.abs(entry - slPrice);
const tpPrice = isBuy ? entry + riskDist*cfg.rr : entry - riskDist*cfg.rr;
const stopLossPercent = entry>0 ? (riskDist/entry*100) : 0;
const rec = {
id: symbol+"_"+tfKey+"_"+Date.now()+"_"+Math.floor(Math.random()*1000),
symbol, timeframe:tfKey, direction: isBuy?"BUY":"SELL",
signalScore: sig.score, adx: sig.adx, zoneId: sig.ob.id,
signalType: sig.signalType, reason: sig.reason,
entryPrice: entry, stopLoss: slPrice, takeProfit: tpPrice, stopLossPercent,
createdAt: sig.time || Date.now(),
result: "pending"
};
addHistorySignal(rec);
return rec;
}

function checkPendingResults(symbol, tfKey, eng){
const h = loadHistory();
const bar = eng.candles[eng.candles.length-1];
if(!bar) return;
h.filter(s=>s.symbol===symbol && s.timeframe===tfKey && s.result==="pending").forEach(sig=>{
const isBuy = sig.direction === "BUY";
const hitTP = isBuy ? bar.high >= sig.takeProfit : bar.low <= sig.takeProfit;
const hitSL = isBuy ? bar.low <= sig.stopLoss : bar.high >= sig.stopLoss;
const ob = eng.findObById(sig.zoneId);
const zoneBroken = !ob;
let patch = null;
if(hitTP) patch = {result:"win", closedAt:Date.now(), exitPrice:sig.takeProfit};
else if(hitSL) patch = {result:"loss", closedAt:Date.now(), exitPrice:sig.stopLoss};
else if(zoneBroken) patch = {result:"expired", closedAt:Date.now(), exitPrice:bar.close};
if(patch){
updateHistorySignal(sig.id, patch);
const updated = Object.assign({}, sig, patch);
notifySignalClosed(updated);
telegramSignalClosed(updated);
}
});
}

+'<div class="sig-score"><div class="score-num">'+sig.signalScore+'</div><div class="score-lbl">'+t("score")+'</div></div>'
+'</div>'
+'<div class="sig-grid">'
+'<div class="sg-item"><div class="sg-label">'+t("entry")+'</div><div class="sg-val">'+fmtPrice(sig.entryPrice)+'</div></div>'
+'<div class="sg-item"><div class="sg-label">'+t("sl")+'</div><div class="sg-val" style="color:var(--bear);">'+fmtPrice(sig.stopLoss)+'</div></div>'
+'<div class="sg-item"><div class="sg-label">'+t("tp")+'</div><div class="sg-val" style="color:var(--bull);">'+fmtPrice(sig.takeProfit)+'</div></div>'
+'</div>'
+'</div>';
}).join("");
}

function renderEmptyState(){
if(scanning){
return '<div class="empty"><div class="spinner" style="margin:0 auto 14px;width:34px;height:34px;"></div>'
+'<h3>'+t("scanningMsg")+'</h3><p>'+t("scanningDesc")+'</p></div>';
}
return '<div class="empty"><span class="ic">📭</span><h3>'+t("noSignalsTitle")+'</h3><p>'+t("noSignalsDesc")+'</p>'
+'<div class="criteria-list">'
+'<div class="criteria-item"><span class="dot2">●</span><span>'+tf("critScore",{score:settings.minScore})+'</span></div>'
+'<div class="criteria-item"><span class="dot2">●</span><span>'+tf("critADX",{adx:settings.adxThresh})+'</span></div>'
+'<div class="criteria-item"><span class="dot2">●</span><span>'+t("critOB")+'</span></div>'
+'<div class="criteria-item"><span class="dot2">●</span><span>'+t("critSL")+'</span></div>'
+'</div>'
+'<div class="scan-note">'+tf("scanEvery",{sec:settings.scanIntervalSec})+'</div>'
+'</div>';
}

function renderHistoryList(){
const h = loadHistory();
const wrap = document.getElementById("historyList");
if(h.length===0){
wrap.innerHTML = '<div class="empty"><span class="ic">☰</span><p>'+t("noSignals")+'</p></div>';
return;
}
wrap.innerHTML = h.map(sig=>{
const badgeClass = sig.result==="win" ? "result-win" : (sig.result==="loss" ? "result-loss" : (sig.result==="expired" ? "result-expired" : ""));
const badgeText = sig.result==="win" ? t("win") : (sig.result==="loss" ? t("loss") : (sig.result==="expired" ? t("expired") : t("pending")));
return '<div class="history-item" onclick="openSheet(\''+sig.id+'\')">'
+'<div class="hi-left"><div class="hi-sym">'+sig.symbol+' · '+sig.direction+'</div>'
+'<div class="hi-time">'+fmtDate(sig.createdAt)+' '+fmtTime(sig.createdAt)+'</div></div>'
+'<div class="result-badge '+badgeClass+'">'+badgeText+'</div>'
+'</div>';
}).join("");
}

function clearHistory(){
if(!confirm(t("confirmReset"))) return;
saveHistory([]);
renderHistoryList();
renderSignalList();
}

function openSheet(id){
const sig = loadHistory().find(s=>s.id===id);
if(!sig) return;
chartSymbol = sig.symbol;
chartTF = sig.timeframe;
renderChart();
const isBuy = sig.direction==="BUY";
const resultBadge = sig.result==="pending" ? "" :
('<div class="result-badge '+(sig.result==="win"?"result-win":sig.result==="loss"?"result-loss":"result-expired")+'" style="margin-bottom:10px;">'
+(sig.result==="win"?t("win"):sig.result==="loss"?t("loss"):t("expired"))+'</div>');
document.getElementById("sheetContent").innerHTML =
'<div style="text-align:center;margin-bottom:6px;">'
+'<span class="sig-badge '+(isBuy?"buy":"sell")+'">'+sig.direction+'</span>'
+'<div class="sig-sym" style="margin-top:8px;font-size:16px;">'+sig.symbol+' · '+(TF_LIST.find(x=>x.key===sig.timeframe)||{}).label+'</div>'
+'</div>'
+resultBadge
+'<div class="sig-grid">'
+'<div class="sg-item"><div class="sg-label">'+t("entry")+'</div><div class="sg-val">'+fmtPrice(sig.entryPrice)+'</div></div>'
+'<div class="sg-item"><div class="sg-label">'+t("sl")+'</div><div class="sg-val" style="color:var(--bear);">'+fmtPrice(sig.stopLoss)+'</div></div>'
+'<div class="sg-item"><div class="sg-label">'+t("tp")+'</div><div class="sg-val" style="color:var(--bull);">'+fmtPrice(sig.takeProfit)+'</div></div>'
+'<div class="sg-item"><div class="sg-label">'+t("adx")+'</div><div class="sg-val">'+sig.adx.toFixed(1)+'</div></div>'
+'<div class="sg-item"><div class="sg-label">'+t("score")+'</div><div class="sg-val">'+sig.signalScore+'/100</div></div>'
+'<div class="sg-item"><div class="sg-label">'+t("slPct")+'</div><div class="sg-val">'+sig.stopLossPercent.toFixed(2)+'%</div></div>'
+'</div>'
+'<div class="reason-box"><b>'+t("reasonTitle")+':</b><br>'+sig.reason+'<br><span style="color:var(--dim);">'+t("zone")+' #'+sig.zoneId+' · '+t("signalType")+': '+sig.signalType+'</span></div>';
document.getElementById("sheetOverlay").classList.add("open");
document.getElementById("detailSheet").classList.add("open");
}
function closeSheet(){
document.getElementById("sheetOverlay").classList.remove("open");
document.getElementById("detailSheet").classList.remove("open");
}

/* ---------------- Candlestick chart (canvas) ---------------- */

function renderChart(){
document.getElementById("chartSymLabel").textContent = chartSymbol;
document.getElementById("chartTfLabel").textContent = (TF_LIST.find(x=>x.key===chartTF)||{}).label || chartTF;
const eng = engines[engineKey(chartSymbol, chartTF)];
const canvas = document.getElementById("chartCanvas");
const ctx = canvas.getContext("2d");
const dpr = window.devicePixelRatio || 1;
const cssW = canvas.clientWidth || 320;
const cssH = 150;
canvas.width = cssW*dpr;
canvas.height = cssH*dpr;
ctx.setTransform(dpr,0,0,dpr,0,0);
ctx.clearRect(0,0,cssW,cssH);
if(!eng || eng.candles.length===0){
ctx.fillStyle = "#7c8798";
ctx.font = "12px monospace";
ctx.fillText("--", cssW/2-10, cssH/2);
return;
}
const candles = eng.candles.slice(-60);
const highs = candles.map(c=>c.high);
const lows = candles.map(c=>c.low);
const maxP = Math.max(...highs);
const minP = Math.min(...lows);
const range = Math.max(maxP-minP, 0.0000001);
const padTop = 8, padBot = 8;
const usableH = cssH - padTop - padBot;
const candleW = cssW / candles.length;
candles.forEach((c,i)=>{
const x = i*candleW + candleW/2;
const yHigh = padTop + (1-(c.high-minP)/range)*usableH;
const yLow = padTop + (1-(c.low-minP)/range)*usableH;
const yOpen = padTop + (1-(c.open-minP)/range)*usableH;
const yClose = padTop + (1-(c.close-minP)/range)*usableH;
const up = c.close >= c.open;
ctx.strokeStyle = up ? "#00ff88" : "#ff3355";
ctx.fillStyle = up ? "#00ff88" : "#ff3355";
ctx.lineWidth = 1;
ctx.beginPath();
ctx.moveTo(x, yHigh);
ctx.lineTo(x, yLow);
ctx.stroke();
const bodyTop = Math.min(yOpen,yClose);
const bodyH = Math.max(Math.abs(yClose-yOpen), 1);
ctx.fillRect(x-candleW*0.32, bodyTop, candleW*0.64, bodyH);
});
}

/* ---------------- Settings UI ---------------- */

function buildSymbolChips(){
const wrap = document.getElementById("symbolChips");
wrap.innerHTML = "";
ALL_SYMBOLS.forEach(sym=>{
const chip = document.createElement("button");
chip.className = "symbol-chip"+(settings.enabledSymbols.includes(sym) ? " on" : "");
chip.textContent = sym.replace("USDT","");
chip.onclick = ()=>{
const idx = settings.enabledSymbols.indexOf(sym);
if(idx>=0) settings.enabledSymbols.splice(idx,1);
else settings.enabledSymbols.push(sym);
chip.classList.toggle("on");
};
wrap.appendChild(chip);
});
}

function buildTFSelect(){
const sel = document.getElementById("s_tf");
sel.innerHTML = "";
TF_LIST.forEach(x=>{
const opt = document.createElement("option");
opt.value = x.key; opt.textContent = x.label;
if(x.key===settings.timeframe) opt.selected = true;
sel.appendChild(opt);
});
}

function fillSettingsForm(){
buildSymbolChips();
buildTFSelect();
document.getElementById("s_interval").value = settings.scanIntervalSec;
document.getElementById("s_adxThresh").value = settings.adxThresh;
document.getElementById("s_minScore").value = settings.minScore;
document.getElementById("s_rr").value = settings.rr;
document.getElementById("s_notifEnable").classList.toggle("on", !!settings.notifEnable);
document.getElementById("s_tgEnable").classList.toggle("on", !!settings.tgEnable);
document.getElementById("s_tgToken").value = settings.tgToken;
document.getElementById("s_tgChat").value = settings.tgChat;
}

function toggleSwitch(id){
document.getElementById(id).classList.toggle("on");
}

function saveSettings(){
settings.timeframe = document.getElementById("s_tf").value;
settings.scanIntervalSec = clampf2(parseInt(document.getElementById("s_interval").value),10,300,30);
settings.adxThresh = clampf2(parseFloat(document.getElementById("s_adxThresh").value),0,60,15);
settings.minScore = clampf2(parseFloat(document.getElementById("s_minScore").value),0,100,60);
settings.rr = clampf2(parseFloat(document.getElementById("s_rr").value),0.2,10,2);
settings.notifEnable = document.getElementById("s_notifEnable").classList.contains("on");
settings.tgEnable = document.getElementById("s_tgEnable").classList.contains("on");
settings.tgToken = document.getElementById("s_tgToken").value.trim();
settings.tgChat = document.getElementById("s_tgChat").value.trim();
if(settings.enabledSymbols.length===0) settings.enabledSymbols = ALL_SYMBOLS.slice();
persistSettings();
engines = {};
chartTF = settings.timeframe;
restartScanLoop();
alert(t("saveSettings"));
}

function resetAll(){
if(!confirm(t("confirmReset"))) return;
saveHistory([]);
engines = {};
renderHistoryList();
renderSignalList();
}

/* ---------------- PWA install ---------------- */

window.addEventListener("beforeinstallprompt", (e)=>{
e.preventDefault();
deferredInstallPrompt = e;
document.getElementById("installFab").classList.add("show");
});
function installPWA(){
if(!deferredInstallPrompt) return;
deferredInstallPrompt.prompt();
deferredInstallPrompt.userChoice.then(()=>{
deferredInstallPrompt = null;
document.getElementById("installFab").classList.remove("show");
});
}

/* ---------------- Loading screen / scan loop ---------------- */

let loadingHidden = false;
function hideLoadingScreen(){
if(loadingHidden) return;
loadingHidden = true;
const el = document.getElementById("loadingScreen");
el.style.opacity = "0";
el.style.transition = "opacity .3s";
setTimeout(()=>{ el.style.display = "none"; }, 300);
}

function restartScanLoop(){
if(scanTimer) clearInterval(scanTimer);
runScanCycle(false);
scanTimer = setInterval(()=>runScanCycle(false), settings.scanIntervalSec*1000);
}

document.addEventListener("visibilitychange", ()=>{
if(document.visibilityState==="visible") runScanCycle(false);
});

function init(){
applyI18n();
buildSymbolChips();
buildTFSelect();
fillSettingsForm();
updateScanStatus(false);
renderSignalList();
renderChart();
restartScanLoop();
setTimeout(hideLoadingScreen, 2000);
setInterval(()=>{ updateScanStatus(scanning); }, 3000);
}
window.addEventListener("load", init);

</script>
</body>
